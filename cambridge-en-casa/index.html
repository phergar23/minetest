    this.set('normal', 8, PC.grey); d.text(pdfSafe(this.meta.right || ''), this.W - this.MR, 11.5, { align: 'right' });
    d.setDrawColor(...PC.omr); d.setLineWidth(0.35); d.line(this.ML, 13.6, this.W - this.MR, 13.6);
    this.y = this.MT;
  }
  page() { this.d.addPage(); this.head(); }
  need(h) { if (this.y + h > this.H - this.MB) { this.page(); return true; } return false; }
  sp(mm) { this.y += mm; }
  blob() {
    const n = this.d.getNumberOfPages();
    for (let i = 1; i <= n; i++) { this.d.setPage(i); this.set('normal', 7.5, PC.grey); this.d.text(`${i} / ${n}`, this.W / 2, this.H - 8, { align: 'center' }); }
    return this.d.output('blob');
  }

  /* Rich text: segments [{t, b, i, color, strike, size}] or gap tokens {gapW, stem} */
  layout(segs, o = {}) {
    const d = this.d, size = o.size || 10.5, x0 = o.x ?? this.ML, width = o.width ?? (this.CW - (x0 - this.ML));
    const lh = this.lh(size) * (o.lh || 1);
    const toks = [];
    for (const s of segs) {
      if (!s) continue;
      if (s.gapW) { toks.push({ gapW: s.gapW, s }); continue; }
      const parts = pdfSafe(s.t).split(/(\s+)/);
      for (const p of parts) {
        if (!p) continue;
        if (/^\s+$/.test(p)) { const nl = (p.match(/\n/g) || []).length; toks.push(nl ? { br: nl } : { sp: true }); }
        else toks.push({ w: p, s });
      }
    }
    this.set('normal', size); const SPW = d.getTextWidth(' ');
    const lines = []; let line = [], lw = 0, pend = false;
    const push = () => { lines.push({ items: line, gapAfter: 0 }); line = []; lw = 0; pend = false; };
    for (const t of toks) {
      if (t.sp) { pend = line.length > 0; continue; }
      if (t.br) { if (line.length) push(); else if (!lines.length) continue; if (t.br > 1 && lines.length) lines[lines.length - 1].gapAfter = lh * 0.5; continue; }
      let w;
      if (t.gapW) w = t.gapW; else { this.set(styleOf(t.s), t.s.size || size); w = d.getTextWidth(t.w); }
      const add = (pend ? SPW : 0) + w;
      if (lw + add > width && line.length) { push(); line.push({ ...t, x: 0, width: w }); lw = w; continue; }
      line.push({ ...t, x: lw + (pend ? SPW : 0), width: w }); lw += add; pend = false;
    }
    if (line.length) push();
    return { lines, lh, size, x0 };
  }
  height(segs, o = {}) { const L = this.layout(segs, o); return L.lines.reduce((t, l) => t + L.lh + l.gapAfter, 0); }
  rich(segs, o = {}) {
    const d = this.d, L = this.layout(segs, o), { lh, size, x0 } = L;
    for (const ln of L.lines) {
      this.need(lh);
      const base = this.y + size * 0.3528 * 0.8;
      for (const it of ln.items) {
        const s = it.s, col = s.color || o.color || PC.ink;
        if (it.gapW) { d.setDrawColor(...PC.ink); d.setLineWidth(0.3); d.line(x0 + it.x, base + 0.9, x0 + it.x + it.gapW, base + 0.9); continue; }
        this.set(styleOf(s), s.size || size, col);
        d.text(it.w, x0 + it.x, base);
        if (s.strike) { d.setDrawColor(...col); d.setLineWidth(0.3); const yy = base - size * 0.3528 * 0.3; d.line(x0 + it.x, yy, x0 + it.x + it.width, yy); }
      }
      if (o.onLine) o.onLine(ln.items, base);
      this.y += lh + ln.gapAfter;
    }
  }
  text(t, o = {}) { this.rich([{ t, b: o.b, i: o.i, color: o.color }], o); }

  title(t, sub) {
    this.need(18);
    this.rich([{ t, b: true }], { size: 17 });
    if (sub) { this.sp(0.5); this.rich([{ t: sub, color: PC.grey }], { size: 10 }); }
    this.sp(3);
  }
  partHead(label, right) {
    this.need(22); this.sp(2);
    const d = this.d, y = this.y;
    d.setFillColor(...PC.ink); d.roundedRect(this.ML, y, 22, 7.2, 1.2, 1.2, 'F');
    this.set('bold', 10.5, [255, 255, 255]); d.text(pdfSafe(label), this.ML + 11, y + 5, { align: 'center' });
    if (right) { this.set('normal', 8.5, PC.grey); d.text(pdfSafe(right), this.W - this.MR, y + 4.8, { align: 'right' }); }
    this.y = y + 10;
  }
  h3(t, color = PC.ink) { this.need(12); this.sp(1.5); this.rich([{ t, b: true, color }], { size: 12 }); this.sp(1); }
  small(t, o = {}) { this.rich([{ t, color: o.color || PC.grey, i: o.i }], { size: o.size || 9, x: o.x }); }
  box(segsOrText, o = {}) {
    const segs = typeof segsOrText === 'string' ? [{ t: segsOrText }] : segsOrText;
    const pad = 3, size = o.size || 9.5, x = this.ML + pad, width = this.CW - 2 * pad;
    const h = this.height(segs, { size, x, width }) + 2 * pad - 1;
    this.need(h + 2);
    const d = this.d;
    d.setFillColor(...(o.fill || PC.omrSoft)); d.setDrawColor(...(o.stroke || o.fill || PC.omrSoft));
    d.roundedRect(this.ML, this.y, this.CW, h, 2, 2, o.stroke ? 'FD' : 'F');
    this.y += pad;
    this.rich(segs, { size, x, width });
    this.y += pad + 1;
  }
  rule(color = PC.light) { this.need(4); this.d.setDrawColor(...color); this.d.setLineWidth(0.25); this.d.line(this.ML, this.y + 1, this.W - this.MR, this.y + 1); this.sp(3); }
  lozenge(x, y, L, filled, color = PC.omr) {
    const d = this.d, w = 8, h = 4.4;
    d.setLineWidth(0.3); d.setDrawColor(...color);
    if (filled) { d.setFillColor(...PC.pencil); d.roundedRect(x, y, w, h, 2.2, 2.2, 'FD'); this.set('bold', 6.8, [255, 255, 255]); }
    else { d.roundedRect(x, y, w, h, 2.2, 2.2, 'S'); this.set('bold', 6.8, color); }
    d.text(L, x + w / 2, y + 3.15, { align: 'center' });
  }
  boxes(x, y, n, bw = 4.7, bh = 6.2) {
    const d = this.d; d.setDrawColor(...PC.omr); d.setLineWidth(0.25);
    for (let i = 0; i < n; i++) d.rect(x + i * bw, y, bw, bh);
  }
}

/* ---------- helpers for exam content ---------- */
function gapSplit(text, fn) {
  const segs = []; let last = 0;
  String(text || '').replace(/\[\[(\d+)\]\]/g, (m, k, off) => { segs.push({ t: text.slice(last, off) }); segs.push(...fn(+k)); last = off + m.length; return m; });
  segs.push({ t: String(text || '').slice(last) });
  return segs;
}
function scriptLines(script) {
  if (!script) return [];
  if (typeof script === 'string') return [{ speaker: '', text: script }];
  if (Array.isArray(script)) return script.map(l => (typeof l === 'string' ? { speaker: '', text: l } : { speaker: str(l.speaker), gender: l.gender, text: str(l.text) }));
  return [];
}

/* mode: {corr: bool, sess, marks, answers, errors} */
function markOf(mode, pid, n) { return mode && mode.corr ? (mode.marks[`${pid}:${n}`] || { status: 'blank', points: 0 }) : null; }
function givenOf(mode, pid, n) { return mode && mode.corr ? String(mode.answers[`${pid}:${n}`] || '').trim() : ''; }

function corrGapSegs(mode, pid, n, keyShown, givenShown) {
  const m = markOf(mode, pid, n);
  if (m.status === 'correct') return [{ t: `(${n}) `, b: true, color: PC.ok }, { t: givenShown || keyShown, b: true, color: PC.ok }];
  const out = [{ t: `(${n}) `, b: true, color: PC.bad }];
  if (givenShown) out.push({ t: givenShown, strike: true, color: PC.bad }); else out.push({ t: '(en blanco)', i: true, color: PC.bad });
  out.push({ t: ' ' }, { t: keyShown, b: true, color: PC.ok });
  return out;
}

function optGrid(pdf, n, options, letters, o = {}) {
  const d = pdf.d, size = 10, labelW = 9, colsW = pdf.CW - labelW;
  pdf.set('normal', size);
  const widths = letters.map(L => d.getTextWidth(pdfSafe(options[L] || '')) + 8);
  let cols = 4; if (widths.some(w => w > colsW / 4)) cols = 2; if (widths.some(w => w > colsW / 2)) cols = 1;
  if (cols === 1) return mcqBlock(pdf, n, '', options, letters, o);
  const rows = Math.ceil(letters.length / cols), rowH = pdf.lh(size) + 1;
  pdf.need(rows * rowH + 1);
  const base0 = pdf.y + size * 0.3528 * 0.8;
  pdf.set('bold', size, o.key ? (o.given === o.key ? PC.ok : PC.bad) : PC.ink); d.text(String(n), pdf.ML, base0);
  letters.forEach((L, i) => {
    const r = Math.floor(i / cols), c = i % cols, x = pdf.ML + labelW + c * (colsW / cols), y = base0 + r * rowH;
    let col = PC.ink, strike = false, bold = false;
    if (o.key) { if (L === o.key) { col = PC.ok; bold = true; } else if (L === o.given) { col = PC.bad; strike = true; } else col = PC.grey; }
    pdf.set('bold', size, col); d.text(L, x, y);
    const t = pdfSafe(options[L] || '');
    pdf.set(bold ? 'bold' : 'normal', size, col); d.text(t, x + 5, y);
    if (strike) { d.setDrawColor(...col); d.setLineWidth(0.3); d.line(x + 5, y - 1.1, x + 5 + d.getTextWidth(t), y - 1.1); }
  });
  pdf.y += rows * rowH + 1.2;
}

function mcqBlock(pdf, n, stem, options, letters, o = {}) {
  const d = pdf.d, size = 10.5, xs = pdf.ML + 8, xo = pdf.ML + 15;
  const stemSegs = Array.isArray(stem) ? stem : [{ t: stem }];
  const hStem = stem ? pdf.height(stemSegs, { x: xs, size }) : 0;
  const hOpts = letters.reduce((t, L) => t + pdf.height([{ t: options[L] || '' }], { x: xo, size }), 0);
  pdf.need(Math.min(hStem + hOpts + 3, 110));
  const nCol = o.key ? (o.given === o.key ? PC.ok : PC.bad) : PC.ink;
  pdf.need(pdf.lh(size));
  pdf.set('bold', size, nCol); d.text(String(n), pdf.ML, pdf.y + size * 0.3528 * 0.8);
  if (stem) pdf.rich(stemSegs, { x: xs, size });
  for (const L of letters) {
    let col = PC.ink, strike = false, bold = false;
    if (o.key) { if (L === o.key) { col = PC.ok; bold = true; } else if (L === o.given) { col = PC.bad; strike = true; } else col = PC.grey; }
    pdf.need(pdf.lh(size));
    pdf.set('bold', size, col); d.text(L, xs, pdf.y + size * 0.3528 * 0.8);
    pdf.rich([{ t: options[L] || '', color: col, b: bold, strike }], { x: xo, size });
  }
  pdf.sp(2.2);
}

function numBoxRow(pdf, stemSegs, n, o = {}) {
  // statement on the left, numbered answer box on the right (matching tasks)
  const d = pdf.d, size = 10.5, boxW = o.corr ? 26 : 16, width = pdf.CW - boxW - 12;
  const h = pdf.height(stemSegs, { size, width });
  pdf.need(Math.max(h, 7) + 1.5);
  const y0 = pdf.y;
  pdf.rich(stemSegs, { size, width });
  const bx = pdf.W - pdf.MR - boxW, by = y0 - 0.4;
  pdf.set('bold', 9.5, PC.ink); d.text(String(n), bx - 2, by + 4.3, { align: 'right' });
  d.setDrawColor(...PC.ink); d.setLineWidth(0.3); d.rect(bx, by, boxW, 6);
  if (o.corr) {
    const m = o.mark;
    if (m.status === 'correct') { pdf.set('bold', 10, PC.ok); d.text(o.key, bx + boxW / 2, by + 4.3, { align: 'center' }); }
    else {
      pdf.set('normal', 10, PC.bad); const g = o.given || '-'; d.text(g, bx + 5, by + 4.3, { align: 'center' });
      d.setDrawColor(...PC.bad); d.line(bx + 3, by + 3, bx + 7, by + 3);
      pdf.set('bold', 10, PC.ok); d.text(o.key, bx + boxW - 7, by + 4.3, { align: 'center' });
    }
  }
  pdf.y = Math.max(pdf.y, y0 + 7) + 1;
}

/* ---------- render one part (exam paper or corrected copy) ---------- */
function renderPart(pdf, sess, part, mode) {
  const ex = EXAMS[sess.level], P = ex.parts[part.id], L = plainLetters(P), corr = !!(mode && mode.corr);
  const a = P.first, b = P.first + P.count - 1;
  let right = `${P.paper} · ${P.title}`;
  if (corr && mode.results?.byPart?.[part.id]) { const bp = mode.results.byPart[part.id]; right += `   ·   ${bp.score}/${bp.max}`; }
  pdf.partHead(P.label, right);
  if (part.intro && !['l-extracts'].includes(P.kind)) pdf.rich([{ t: part.intro, b: true }], { size: 10.5 });
  pdf.rich([{ t: fill(P.ins, P) }], { size: 10.5 });
  pdf.sp(2.5);
  const qBy = n => part.questions.find(q => q.n === n);
  const exGap = () => {
    const e = part.example || {};
    if (P.kind === 'mcq-cloze') return [{ t: '(0) ', b: true }, { gapW: 20 }];
    return [{ t: '(0) ', b: true }, { t: str(e.answer).toUpperCase(), b: true }];
  };

  switch (P.kind) {
    case 'mcq-cloze': case 'open-cloze': case 'word-formation': {
      if (P.example && part.example && P.kind === 'mcq-cloze') {
        pdf.rich([{ t: 'Example:', b: true }], { size: 10 });
        optGrid(pdf, 0, part.example.options || {}, L, {});
        const y = pdf.y; pdf.set('bold', 9, PC.ink); pdf.d.text('0', pdf.ML, y + 3.2);
        L.forEach((l, i) => pdf.lozenge(pdf.ML + 9 + i * 10, y, l, l === str(part.example.answer).toUpperCase(), PC.grey));
        pdf.y = y + 8;
      } else if (P.example && part.example && P.kind === 'open-cloze') {
        pdf.rich([{ t: 'Example: ', b: true }, { t: '(0) ' }, { t: str(part.example.answer).toUpperCase(), b: true }], { size: 10 }); pdf.sp(2);
      } else if (P.example && part.example && P.kind === 'word-formation') {
        pdf.rich([{ t: 'Example: ', b: true }, { t: '(0) ' }, { t: str(part.example.answer).toUpperCase(), b: true }], { size: 10 }); pdf.sp(2);
      }
      if (part.title) { pdf.need(12); pdf.rich([{ t: part.title, b: true }], { size: 12 }); pdf.sp(1.5); }
      const wf = P.kind === 'word-formation';
      const segs = gapSplit(part.text, n => {
        if (n === 0) return wf ? [...exGap(), { gapW: 0.01, stem: part.example?.stem }] : exGap();
        const q = qBy(n); if (!q) return [{ t: `(${n})` }];
        if (corr) {
          const g = givenOf(mode, part.id, n);
          const key = P.letters ? `${q.answer} ${q.options?.[q.answer] || ''}`.trim() : String(q.answer).toUpperCase();
          const gv = P.letters ? (g ? `${g} ${q.options?.[g] || ''}`.trim() : '') : g.toUpperCase();
          const s = corrGapSegs(mode, part.id, n, key, gv);
          if (wf) s.push({ gapW: 0.01, stem: q.stem });
          return s;
        }
        return wf ? [{ t: `(${n})`, b: true }, { t: ' ' }, { gapW: 24, stem: q.stem }] : [{ t: `(${n})`, b: true }, { t: ' ' }, { gapW: 22 }];
      });
      const opts = wf ? {
        width: pdf.CW - 36, lh: 1.25,
        onLine: (items, base) => {
          const stems = items.filter(i => i.s && i.s.stem).map(i => i.s.stem);
          if (stems.length) { pdf.set('bold', 10.5, PC.ink); pdf.d.text(pdfSafe(stems.join(' / ').toUpperCase()), pdf.W - pdf.MR, base, { align: 'right' }); }
        }
      } : { lh: 1.25 };
      pdf.rich(segs, opts);
      pdf.sp(3);
      if (P.kind === 'mcq-cloze') for (const q of part.questions) {
        optGrid(pdf, q.n, q.options || {}, L, corr ? { key: q.answer, given: givenOf(mode, part.id, q.n) } : {});
      }
      break;
    }
    case 'transformation': {
      const e = part.example;
      const item = (n, q, isEx) => {
        const h = pdf.lh(10.5) * 4 + 6; pdf.need(h);
        const y0 = pdf.y;
        pdf.set('bold', 10.5, isEx ? PC.grey : PC.ink); pdf.d.text(isEx ? '0' : String(n), pdf.ML, y0 + 3.7);
        pdf.rich([{ t: q.first }], { x: pdf.ML + 9 });
        pdf.sp(0.8);
        pdf.rich([{ t: str(q.keyword).toUpperCase(), b: true }], { x: pdf.ML + 20 });
        pdf.sp(0.8);
        let segs;
        const parts = str(q.second).split(/_{2,}/);
        if (isEx) segs = [{ t: parts[0] }, { t: ' ' + str(q.answer).toUpperCase() + ' ', b: true, i: true }, { t: parts.slice(1).join(' ') }];
        else if (corr) {
          const m = markOf(mode, part.id, n), g = givenOf(mode, part.id, n).toUpperCase();
          const mid = m.status === 'correct'
            ? [{ t: ' ' + g + ' ', b: true, color: PC.ok }]
            : [{ t: ' ' }, g ? { t: g, strike: true, color: PC.bad } : { t: '(en blanco)', i: true, color: PC.bad }, { t: ' ' }, { t: str(q.answer).toUpperCase(), b: true, color: PC.ok }, { t: ` [${m.points}/2] `, b: true, color: m.points ? PC.omr : PC.bad }];
          segs = [{ t: parts[0] }, ...mid, { t: parts.slice(1).join(' ') }];
        } else segs = [{ t: parts[0] }, { t: ' ' }, { gapW: 48 }, { t: ' ' }, { t: parts.slice(1).join(' ') }];
        pdf.rich(segs, { x: pdf.ML + 9 });
        pdf.sp(4);
      };
      if (e && e.first) { pdf.rich([{ t: 'Example:', b: true }], { size: 10 }); pdf.sp(1); item(0, e, true); pdf.rule(); }
      for (const q of part.questions) item(q.n, q, false);
      break;
    }
    case 'reading-mc': {
      if (part.title) { pdf.need(12); pdf.rich([{ t: part.title, b: true }], { size: 12.5 }); pdf.sp(1.5); }
      pdf.rich([{ t: part.text }], { size: 10.5, lh: 1.08 });
      pdf.sp(4);
      for (const q of part.questions) mcqBlock(pdf, q.n, q.stem, q.options || {}, L, corr ? { key: q.answer, given: givenOf(mode, part.id, q.n) } : {});
      break;
    }
    case 'gapped': {
      if (part.title) { pdf.need(12); pdf.rich([{ t: part.title, b: true }], { size: 12.5 }); pdf.sp(1.5); }
      const segs = gapSplit(part.text, n => {
        const q = qBy(n); if (!q) return [{ t: `(${n})` }];
        if (corr) {
          const m = markOf(mode, part.id, n), g = givenOf(mode, part.id, n), sent = part.options?.[q.answer] || '';
          if (m.status === 'correct') return [{ t: `(${n}) ${q.answer}: `, b: true, color: PC.ok }, { t: sent, i: true, color: PC.ok }];
          return [{ t: `(${n}) `, b: true, color: PC.bad }, g ? { t: g, strike: true, color: PC.bad } : { t: '(en blanco)', i: true, color: PC.bad }, { t: ` ${q.answer}: `, b: true, color: PC.ok }, { t: sent, i: true, color: PC.ok }];
        }
        return [{ t: `(${n})`, b: true }, { t: ' ' }, { gapW: 36 }];
      });
      pdf.rich(segs, { size: 10.5, lh: 1.12 });
      pdf.sp(4);
      pdf.need(20);
      for (const l of L) {
        const sent = part.options?.[l] || '';
        const used = corr && part.questions.some(q => q.answer === l);
        pdf.need(pdf.lh(10.5));
        pdf.set('bold', 10.5, corr && !used ? PC.grey : PC.ink); pdf.d.text(l, pdf.ML, pdf.y + 3.7);
        pdf.rich([{ t: sent, color: corr && !used ? PC.grey : PC.ink }], { x: pdf.ML + 8 });
        pdf.sp(1.5);
      }
      if (corr) pdf.small('En gris: la frase que sobraba.');
      break;
    }
    case 'matching': {
      pdf.rich([{ t: 'Which person', b: true }], { size: 10.5 }); pdf.sp(1.5);
      for (const q of part.questions) {
        const g = givenOf(mode, part.id, q.n);
        numBoxRow(pdf, [{ t: q.stem }], q.n, corr ? { corr, mark: markOf(mode, part.id, q.n), key: q.answer, given: g } : {});
      }
      pdf.sp(4);
      if (part.title) { pdf.need(12); pdf.rich([{ t: part.title, b: true }], { size: 12.5 }); pdf.sp(1.5); }
      for (const s of part.sections || []) {
        pdf.need(16);
        pdf.rich([{ t: `${s.id}   `, b: true, size: 12 }, { t: s.heading || '', b: true }], { size: 10.5 });
        pdf.sp(0.8);
        pdf.rich([{ t: s.text || '' }], { size: 10.5, lh: 1.05 });
        pdf.sp(3);
      }
      break;
    }
    case 'notices': {
      for (const q of part.questions) {
        const pad = 3, bx = pdf.ML + 9, bw = 88;
        const segs = [{ t: (q.textType ? q.textType + '\n' : ''), b: true, size: 8.5, color: PC.grey }, { t: q.text || '' }];
        const hBox = pdf.height(segs, { x: bx + pad, width: bw - 2 * pad, size: 10 }) + 2 * pad;
        const hOpt = L.reduce((t, l) => t + pdf.height([{ t: q.options?.[l] || '' }], { x: bx + bw + 12, size: 10 }), 0);
        pdf.need(Math.max(hBox, hOpt) + 5);
        const y0 = pdf.y;
        pdf.set('bold', 10.5, corr ? (markOf(mode, part.id, q.n).status === 'correct' ? PC.ok : PC.bad) : PC.ink); pdf.d.text(String(q.n), pdf.ML, y0 + 4);
        pdf.d.setDrawColor(...PC.ink); pdf.d.setLineWidth(0.35); pdf.d.roundedRect(bx, y0, bw, hBox, 1.5, 1.5, 'S');
        pdf.y = y0 + pad; pdf.rich(segs, { x: bx + pad, width: bw - 2 * pad, size: 10 });
        const yEndBox = y0 + hBox;
        pdf.y = y0;
        const g = givenOf(mode, part.id, q.n);
        for (const l of L) {
          let col = PC.ink, strike = false, bold = false;
          if (corr) { if (l === q.answer) { col = PC.ok; bold = true; } else if (l === g) { col = PC.bad; strike = true; } else col = PC.grey; }
          pdf.set('bold', 10, col); pdf.d.text(l, bx + bw + 6, pdf.y + 3.5);
          pdf.rich([{ t: q.options?.[l] || '', color: col, b: bold, strike }], { x: bx + bw + 12, size: 10 });
          pdf.sp(1);
        }
        pdf.y = Math.max(pdf.y, yEndBox) + 5;
      }
      break;
    }
    case 'people-match': {
      if (part.intro) { /* intro already printed */ }
      for (const q of part.questions) {
        const g = givenOf(mode, part.id, q.n);
        numBoxRow(pdf, [{ t: (q.name || '') + '  ', b: true }, { t: q.text || '' }], q.n, corr ? { corr, mark: markOf(mode, part.id, q.n), key: q.answer, given: g } : {});
        pdf.sp(1);
      }
      pdf.sp(3);
      if (part.title) { pdf.need(12); pdf.rich([{ t: part.title, b: true }], { size: 12.5 }); pdf.sp(1.5); }
      for (const s of part.sections || []) {
        pdf.need(16);
        pdf.rich([{ t: `${s.id}   `, b: true, size: 12 }, { t: s.heading || '', b: true }], { size: 10.5 });
        pdf.sp(0.5); pdf.rich([{ t: s.text || '' }], { size: 10 }); pdf.sp(2.5);
      }
      break;
    }
    case 'l-extracts': case 'l-interview': {
      if (P.kind === 'l-interview' && part.intro) { /* printed above */ }
      for (const q of part.questions) {
        const stem = P.kind === 'l-extracts' ? [{ t: (q.context ? q.context + ' ' : ''), i: true }, { t: q.stem || '' }] : [{ t: q.stem || '' }];
        mcqBlock(pdf, q.n, stem, q.options || {}, L, corr ? { key: q.answer, given: givenOf(mode, part.id, q.n) } : {});
      }
      break;
    }
    case 'l-gap': {
      if (part.title) { pdf.rich([{ t: part.title, b: true }], { size: 12.5 }); pdf.sp(1.5); }
      for (const q of part.questions) {
        const segs = gapSplit(q.sentence || '', n => {
          if (corr) { const g = givenOf(mode, part.id, n); return corrGapSegs(mode, part.id, n, String(q.answer).toUpperCase(), g.toUpperCase()); }
          return [{ t: `(${n})`, b: true }, { t: ' ' }, { gapW: 38 }];
        });
        pdf.need(12); pdf.rich(segs, { size: 10.5 }); pdf.sp(4);
      }
      break;
    }
    case 'l-speakers': {
      for (const l of L) { pdf.need(pdf.lh(10.5)); pdf.set('bold', 10.5, PC.ink); pdf.d.text(l, pdf.ML, pdf.y + 3.7); pdf.rich([{ t: part.options?.[l] || '' }], { x: pdf.ML + 8 }); pdf.sp(1); }
      pdf.sp(3);
      for (const q of part.questions) {
        const g = givenOf(mode, part.id, q.n);
        numBoxRow(pdf, [{ t: q.speaker || '', b: true }], q.n, corr ? { corr, mark: markOf(mode, part.id, q.n), key: q.answer, given: g } : {});
        pdf.sp(1);
      }
      break;
    }
  }
  pdf.sp(3);
}

function renderTranscript(pdf, part) {
  const lines = [];
  const add = (label, script) => { if (label) lines.push({ t: label + '\n', b: true, color: PC.omr, size: 9 }); for (const l of scriptLines(script)) { if (l.speaker) lines.push({ t: l.speaker + ': ', b: true, size: 9 }); lines.push({ t: l.text + '\n', size: 9 }); } lines.push({ t: '\n' }); };
  if (part.script) {
    if (typeof part.script === 'string') add('', [{ speaker: part.speaker?.name || '', text: part.script }]);
    else add('', part.script);
  }
  for (const q of part.questions) if (q.script) add(q.speaker || `Question ${q.n}`, typeof q.script === 'string' ? [{ speaker: '', text: q.script }] : q.script);
  if (!lines.length) return;
  pdf.h3('Transcripción (audioscript)', PC.omr);
  pdf.rich(lines, { size: 9 });
  pdf.sp(3);
}

function renderQuickItems(pdf, items, prefix, mode) {
  for (const r of items) {
    const key = `${prefix}:${r.n}`, m = mode?.corr ? (mode.marks[key] || { status: 'blank' }) : null, g = mode?.corr ? String(mode.answers[key] || '') : '';
    const prompt = str(r.prompt);
    if (r.type === 'choice') {
      mcqBlock(pdf, r.n, prompt, r.options || {}, Object.keys(r.options || {}), mode?.corr ? { key: r.answer, given: g } : {});
    } else {
      pdf.need(mode?.corr ? 14 : 16);
      const y0 = pdf.y;
      pdf.set('bold', 10.5, m ? (m.status === 'correct' ? PC.ok : PC.bad) : PC.ink); pdf.d.text(r.n, pdf.ML, y0 + 3.7);
      pdf.rich([{ t: prompt }], { x: pdf.ML + 9 });
      if (m) {
        pdf.rich(m.status === 'correct'
          ? [{ t: 'Tu respuesta: ', color: PC.grey }, { t: g, b: true, color: PC.ok }]
          : [{ t: 'Tu respuesta: ', color: PC.grey }, g ? { t: g, strike: true, color: PC.bad } : { t: '(en blanco)', i: true, color: PC.bad }, { t: '   Correcta: ', color: PC.grey }, { t: r.answer, b: true, color: PC.ok }], { x: pdf.ML + 9, size: 10 });
      } else if (r.type === 'rewrite') {
        pdf.need(8); pdf.d.setDrawColor(...PC.light); pdf.d.setLineWidth(0.3); pdf.d.line(pdf.ML + 9, pdf.y + 5, pdf.W - pdf.MR, pdf.y + 5); pdf.sp(6);
      }
      pdf.sp(2.5);
    }
    if (m && m.status !== 'correct' && r.explanation) { pdf.small(r.explanation, { x: pdf.ML + 9 }); pdf.sp(1.5); }
  }
}

function renderReview(pdf, review, mode) {
  if (!review || !review.items?.length) return;
  pdf.partHead('Warm-up', 'Repaso de errores anteriores');
  pdf.sp(2);
  renderQuickItems(pdf, review.items, 'RV', mode);
  pdf.sp(3);
}

function renderGrammar(pdf, g, mode) {
  if (!g) return;
  const corr = !!(mode && mode.corr);
  let right = corr ? 'Gramática del día' : 'Gramática del día · 5 min';
  if (corr && mode.results?.grammar) right += `   ·   ${mode.results.grammar.score}/${mode.results.grammar.max}`;
  pdf.partHead('Grammar', right);
  pdf.rich([{ t: g.title || g.topic, b: true }], { size: 15 });
  if (g.title && g.topic && g.title !== g.topic) pdf.rich([{ t: g.topic, color: PC.grey, i: true }], { size: 9.5 });
  pdf.sp(2);
  if (!corr) {
    if (g.explanation) { pdf.rich([{ t: g.explanation }], { size: 10.5 }); pdf.sp(2.5); }
    if (g.forms?.length) {
      const rows = g.forms.filter(f => f.form || f.example);
      const pad = 3, colA = 62, h = rows.reduce((t, f) => t + Math.max(pdf.height([{ t: f.form, b: true }], { size: 10, width: colA - 4 }), pdf.height([{ t: f.example, i: true }], { size: 10, x: pdf.ML + pad + colA, width: pdf.CW - colA - 2 * pad })) + 1.2, 0) + 2 * pad;
      pdf.need(h + 2);
      const y0 = pdf.y; pdf.d.setFillColor(...PC.fill); pdf.d.roundedRect(pdf.ML, y0, pdf.CW, h, 2, 2, 'F');
      pdf.y = y0 + pad;
      for (const f of rows) {
        const yy = pdf.y;
        pdf.rich([{ t: f.form, b: true }], { size: 10, x: pdf.ML + pad, width: colA - 4 });
        const ya = pdf.y; pdf.y = yy;
        pdf.rich([{ t: f.example, i: true }], { size: 10, x: pdf.ML + pad + colA, width: pdf.CW - colA - 2 * pad });
        pdf.y = Math.max(pdf.y, ya) + 1.2;
      }
      pdf.y = y0 + h + 3;
    }
    if (g.examples?.length) { g.examples.forEach(e => pdf.rich([{ t: '- ' + e }], { size: 10, x: pdf.ML + 2 })); pdf.sp(2); }
    if (g.tip) { pdf.box([{ t: 'Ojo: ', b: true }, { t: g.tip }], { size: 9.8 }); pdf.sp(1); }
    pdf.h3('Practice');
    pdf.rich([{ t: g.instruction || 'Complete the sentences.', b: true }], { size: 10 });
    pdf.rich([{ t: g.onPage ? 'Escribe tus respuestas en esta hoja.' : 'Escribe tus respuestas en la hoja de respuestas (sección Grammar).', i: true, color: PC.grey }], { size: 9 });
    pdf.sp(2);
  }
  renderQuickItems(pdf, g.items || [], 'GR', mode);
  if (corr && g.tip) pdf.box([{ t: 'Recuerda: ', b: true }, { t: g.tip }], { size: 9.5 });
  pdf.sp(3);
}

function pdfMeta(sess, what) {
  const st = S.students[sess.studentId] || { name: '' };
  const ex = EXAMS[sess.level];
  return { title: `${st.name} · ${what}`, left: `${ex.name.toUpperCase()} · PRÁCTICA`, right: `${st.name} · ${niceDate(sess.dateKey)}` };
}
function fileName(sess, what) {
  const st = S.students[sess.studentId] || { name: 'alumno' };
  const sk = (SKILLS[sess.skill]?.es || sess.skill).normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^A-Za-z]+/g, '');
  return `${st.name}_${sess.dateKey}_${sk}_${what}.pdf`.replace(/\s+/g, '');
}

function buildExamPdf(sess) {
  const st = S.students[sess.studentId] || {};
  const pdf = new Pdf(pdfMeta(sess, 'Ejercicios'));
  const ex = EXAMS[sess.level];
  if (sess.skill === 'writing') return buildWritingPdf(sess, pdf);
  if (sess.skill === 'speaking') return buildSpeakingStudentPdf(sess, pdf);
  const listening = (sess.parts || []).some(p => p.id.startsWith('L'));
  pdf.title(`${SKILLS[sess.skill]?.es || ''} · ${st.name}`, `${ex.name} · ${niceDate(sess.dateKey)} · ${sess.parts.map(p => ex.parts[p.id].paper.split(' ')[0] + ' ' + ex.parts[p.id].label).join(', ')}`);
  const examMin = sessionMinutes(sess.level, sess.parts.map(p => p.id));
  pdf.box([
    { t: 'Instrucciones: ', b: true },
    { t: `${sess.grammar ? `${GRAMMAR_MIN} minutos de gramática y luego ${examMin} de práctica de examen (total ${GRAMMAR_MIN + examMin})` : `tiempo recomendado ${examMin} minutos`}. Lápiz y goma, sin diccionario ni ayuda. Escribe tus respuestas en la hoja de respuestas, como en el examen real${listening ? '. Listening: escucharás cada grabación dos veces' : ''}.` }

function buildAnswerSheetPdf(sess, into) {

  pdf.set('normal', 8, PC.omr); d.text('Example:', pdf.ML + 139, yi + 7.6); pdf.set('bold', 8, PC.ink); d.text('0', pdf.ML + 135, yi + 12.6);
  ['A', 'B', 'C', 'D'].forEach((l, i) => pdf.lozenge(pdf.ML + 139 + i * 8.6, yi + 9.6, l, l === 'B'));

    const h = 9 + (twoCol ? Math.max(...[rows.slice(0, perCol), rows.slice(perCol)].map(c => c.reduce((t, r) => t + rowH(r), 0))) : rows.reduce((t, r) => t + rowH(r), 0));
    pdf.need(Math.min(h, 240));

    pdf.set('bold', 9.5, [255, 255, 255]); d.text(pdfSafe(title), pdf.ML + 2.5, top + 4.4);
    pdf.set('normal', 8, [255, 255, 255]); d.text(pdfSafe(sub), pdf.W - pdf.MR - 2.5, top + 4.4, { align: 'right' });
    let y = top + 8.8, col = 0, yCol0 = y;
    rows.forEach((r, i) => {
      if (twoCol && i === perCol) { col = 1; y = yCol0; }
      if (y + rowH(r) > pdf.H - pdf.MB) { pdf.page(); y = pdf.y; yCol0 = y; }
      const x = pdf.ML + col * colW;
      pdf.set('bold', 9.5, PC.ink); d.text(String(r.n), x + 7, y + 3.4, { align: 'right' });
      if (r.kind === 'loz') r.letters.forEach((l, k) => pdf.lozenge(x + 10 + k * 9.2, y + 0.2, l, false));
      else if (r.kind === 'boxes') pdf.boxes(x + 10, y - 1.2, 15, 4.7, 6.4);
      else { d.setDrawColor(...PC.omr); d.setLineWidth(0.3); d.rect(x + 10, y - 1.4, pdf.CW - 12, 7); }
      y += rowH(r);
      pdf.y = Math.max(pdf.y, y);
    });
    pdf.y += 3;
  };
  if (sess.grammar) {
    section('Grammar', 'Gramática del día', sess.grammar.items.map(r => r.type === 'choice' ? { n: r.n, kind: 'loz', letters: Object.keys(r.options || {}) } : { n: r.n, kind: 'long' }));
  }
  if (sess.review) {
    section('Warm-up', 'Repaso', sess.review.items.map(r => r.type === 'choice' ? { n: r.n, kind: 'loz', letters: Object.keys(r.options || {}) } : { n: r.n, kind: 'long' }));
  }
  for (const part of sess.parts || []) {
    const P = ex.parts[part.id];

    section(`${P.paper === 'Listening' ? 'Listening' : 'Reading' + (P.paper.includes('Use') ? ' & Use of English' : '')} · ${P.label}`, P.title, rows);
  }
  return pdf;
}

function buildSolutionsPdf(sess) {
  const st = S.students[sess.studentId] || {};
  const ex = EXAMS[sess.level];
  const pdf = new Pdf(pdfMeta(sess, 'Soluciones'));
  pdf.title(`Soluciones · ${SKILLS[sess.skill]?.es || ''}`, `Para corregir · ${st.name} · ${niceDate(sess.dateKey)}`);
  if (sess.skill === 'writing') {
    const w = sess.writing || {};
    pdf.h3('Tarea'); pdf.rich([{ t: writingTaskText(w, 0) }], { size: 10 }); pdf.sp(2);
    if (w.plan?.length) { pdf.h3('Plan sugerido'); w.plan.forEach(p => pdf.rich([{ t: '- ' + p }], { size: 10 })); pdf.sp(2); }
    if (w.model) { pdf.h3('Respuesta modelo'); pdf.rich([{ t: w.model }], { size: 10.5 }); pdf.small(`${wordCount(w.model)} palabras`); }
    if (sess.grammar) renderReviewKey(pdf, sess.grammar, 'Grammar', sess.grammar.title || 'Gramática');
    if (sess.review) renderReviewKey(pdf, sess.review);
    return pdf;
  }
  if (sess.grammar) renderReviewKey(pdf, sess.grammar, 'Grammar', sess.grammar.title || 'Gramática');
  if (sess.review) renderReviewKey(pdf, sess.review);
  for (const part of sess.parts || []) {
    const P = ex.parts[part.id];
    pdf.partHead(P.label, `${P.paper} · ${P.title}`);
    for (const q of part.questions) {
      const it = { q, part, P, type: P.letters ? 'letter' : 'text' };
      let key = keyText(it);
      if (P.kind === 'transformation' && q.chunks) key += `   (1 punto: ${q.chunks.map(c => c.toUpperCase()).join(' | ')})`;
      if (!P.letters && q.accept && q.accept.length > 1) key += `   · también: ${q.accept.filter(a => a !== normAns(q.answer)).join(', ')}`;
      pdf.need(12);
      pdf.rich([{ t: `${q.n}  `, b: true }, { t: key, b: true, color: PC.ok }], { size: 10.5 });
      if (q.explanation) pdf.small(q.explanation, { x: pdf.ML + 7 });
      pdf.sp(1.2);
    }
    if (part.id.startsWith('L')) renderTranscript(pdf, part);
    pdf.sp(2);
  }
  return pdf;
}

function renderReviewKey(pdf, review, label = 'Warm-up', sub = 'Repaso') {
  pdf.partHead(label, sub);
  for (const r of review.items) {
    const key = r.type === 'choice' ? `${r.answer} (${r.options?.[r.answer] || ''})` : r.answer;
    pdf.need(10); pdf.rich([{ t: `${r.n}  `, b: true }, { t: key, b: true, color: PC.ok }, (r.accept || []).length > 1 ? { t: `   · también: ${r.accept.filter(a => a !== normAns(r.answer)).join(', ')}`, color: PC.grey } : null].filter(Boolean), { size: 10.5 });
    if (r.explanation) pdf.small(r.explanation, { x: pdf.ML + 7 });
    pdf.sp(1);
  }
  pdf.sp(3);
}

function buildCorrectionPdf(sess) {
  if (sess.skill === 'writing') return buildWritingCorrectionPdf(sess);

  const y0 = pdf.y, d = pdf.d;
  d.setFillColor(...PC.fill); d.roundedRect(pdf.ML, y0, pdf.CW, 20, 2, 2, 'F');
  pdf.set('bold', 22, PC.ink); d.text(`${r.score}/${r.max}`, pdf.ML + 5, y0 + 12.5);
  pdf.set('bold', 11, r.pct >= 60 ? PC.ok : PC.bad); d.text(`${r.pct}%`, pdf.ML + 5, y0 + 17.5);
  let x = pdf.ML + 48;
  for (const [pid, b] of Object.entries(r.byPart || {})) {

    pdf.set('normal', 8, PC.grey); d.text(pdfSafe(`${P.paper === 'Listening' ? 'List.' : 'Read.'} ${P.label}`), x, y0 + 7);

  }
  if (r.grammar) { pdf.set('normal', 8, PC.grey); d.text('Grammar', Math.min(x, pdf.W - pdf.MR - 22), y0 + 7); pdf.set('bold', 12, PC.ink); d.text(`${r.grammar.score}/${r.grammar.max}`, Math.min(x, pdf.W - pdf.MR - 22), y0 + 13.5); x += 30; }
  if (r.review) { pdf.set('normal', 8, PC.grey); d.text('Warm-up', Math.min(x, pdf.W - pdf.MR - 22), y0 + 7); pdf.set('bold', 12, PC.ink); d.text(`${r.review.score}/${r.review.max}`, Math.min(x, pdf.W - pdf.MR - 22), y0 + 13.5); }
  pdf.y = y0 + 24;
  if (fb.summary) { pdf.box([{ t: 'Comentario: ', b: true }, { t: fb.summary }], { size: 10 }); pdf.sp(2); }
  pdf.rich([{ t: 'Cómo leer esta corrección: ', b: true, color: PC.grey }, { t: 'en verde lo correcto; en rojo tachado tu respuesta cuando no era correcta, seguida de la buena.', color: PC.grey }], { size: 9 });
  pdf.sp(2);

    if (idx > 0 || pdf.y > 110) pdf.page();

    const P = ex.parts[part.id];
    const misses = part.questions.filter(q => (mode.marks[`${part.id}:${q.n}`] || {}).status !== 'correct');
    if (misses.length) {

          { t: `${q.n}  `, b: true, color: PC.bad },
          { t: 'Tu respuesta: ', color: PC.grey }, { t: g ? givenText(it, g) : '(en blanco)', b: true, color: PC.bad },
          { t: '   Correcta: ', color: PC.grey }, { t: keyText(it), b: true, color: PC.ok },
          m.status === 'partial' ? { t: `   (${m.points}/${it.P.marks || 1} puntos)`, color: PC.omr } : null
        ].filter(Boolean), { size: 10 });

}

/* ---------- writing ---------- */
function writingTaskSegs(w) {
  const out = [];
  if (w.type === 'essay') {
    out.push({ t: (w.context || '') + '\n\n' }, { t: (w.instruction || '') + '\n\n' }, { t: (w.question || '') + '\n\n', b: true }, { t: 'Notes\nWrite about:\n', b: true });
    (w.notes || []).forEach((n, i) => out.push({ t: `${i + 1}. ${n}\n` }));
  } else if (w.type === 'email') {
    out.push({ t: (w.context || '') + '\n\n' });
    out.push({ t: `From: ${w.email?.from || ''}\nSubject: ${w.email?.subject || ''}\n\n`, b: true });
    let body = w.email?.body || '';
    out.push({ t: body + '\n\n', i: true });
    out.push({ t: 'Your notes:\n', b: true });
    (w.notes || []).forEach(n => out.push({ t: `"${n.after}" -> `, i: true }, { t: `${n.note}\n`, b: true }));
    out.push({ t: '\n' + (w.instruction || '') });
  }
  return out;
}

<script>
/* =========================================================
   Listening audio
   - Live playback with the device's English voices (both editions)
   - MP3 rendering with Kokoro neural voices (local edition only)
   ========================================================= */
const VP = (() => { try { return Object.assign({ rate: 0.92, pitch: 1, gap: 450 }, JSON.parse(localStorage.getItem('cec-voice-prefs') || '{}')); } catch (e) { return { rate: 0.92, pitch: 1, gap: 450 }; } })();
function saveVP() { try { localStorage.setItem('cec-voice-prefs', JSON.stringify(VP)); } catch (e) {} }

const TTS = {
  ok: typeof window.speechSynthesis !== 'undefined' && typeof window.SpeechSynthesisUtterance !== 'undefined',
  voices: [],
  init() {
    if (!this.ok) return;
    const load = () => {
      try { this.voices = speechSynthesis.getVoices().filter(v => /^en([-_]|$)/i.test(v.lang) && this.rank(v) > -50); } catch (e) { this.voices = []; }
      if (S.view === 'session' && S.sessTab === 'audio') paintPlayer();
    };
    load();
    try { speechSynthesis.addEventListener('voiceschanged', load); } catch (e) { speechSynthesis.onvoiceschanged = load; }
  },
  gender(v) {
    const n = v.name.toLowerCase();
    if (/female|woman|samantha|karen|kate|serena|moira|tessa|victoria|susan|zira|hazel|libby|sonia|jenny|aria|fiona|martha|stephanie|catherine|nicky|allison|ava|emma|olivia|amy|salli|joanna|kimberly|natasha|clara|maisie|abbie|bella|hollie|sienna|isla|heather/.test(n)) return 'f';
    if (/\bmale|daniel|alex|fred|oliver|arthur|george|ryan|guy|david|mark|thomas|lee|rishi|aaron|james|brian|matthew|justin|joey|tom|william|liam|noah|elliot|ethan|alfie|jack|harry|connor/.test(n)) return 'm';
    return '?';
  },
  rank(v) {
    let r = 0;
    if (/en[-_]GB/i.test(v.lang)) r += 30; else if (/en[-_](IE|AU|NZ|ZA)/i.test(v.lang)) r += 16; else if (/en[-_]US/i.test(v.lang)) r += 10;
    if (/enhanced|premium|natural|neural|online/i.test(v.name)) r += 12;
    if (/google/i.test(v.name)) r += 3;
    if (/compact/i.test(v.name)) r -= 4;
    if (/bad news|bells|boing|bubbles|cellos|wobble|whisper|zarvox|trinoids|organ|jester|superstar|bahh|albert|hysterical|good news|grandma|grandpa|eddy|flo|reed|rocko|sandy|shelley|ralph|kathy|junior|princess|deranged|pipe organ/i.test(v.name)) r -= 100;
    return r;
  },
  ranked(g) { return this.voices.filter(v => g === '?' || this.gender(v) === g).sort((a, b) => this.rank(b) - this.rank(a)); },
  byName(n) { return n ? this.voices.find(v => v.name === n) || null : null; },
  cast(speakers) {
    const map = {};
    const all = this.ranked('?');
    const narrator = this.byName(VP.narrator) || this.ranked('f')[0] || all[0] || null;
    map.__narrator = narrator;
    const pref = { f: this.byName(VP.female), m: this.byName(VP.male) };
    const used = { f: 0, m: 0, '?': 0 };
    for (const sp of speakers) {
      if (map[sp.name] !== undefined) continue;
      const g = sp.gender === 'm' || sp.gender === 'f' ? sp.gender : '?';
      if (used[g] === 0 && pref[g]) { map[sp.name] = pref[g]; used[g]++; continue; }
      let pool = this.ranked(g).filter(v => v !== narrator && v !== pref[g]);
      if (!pool.length) pool = this.ranked(g);
      if (!pool.length) pool = all;
      map[sp.name] = pool.length ? pool[(used[g] - (pref[g] ? 1 : 0) + pool.length) % pool.length] : null;
      used[g]++;
    }
    return map;
  }
};

/* One sentence per utterance so every sentence ends with a real pause. */
function splitSentences(t) {
  const clean = String(t || '').replace(/\s+/g, ' ').trim();
  if (!clean) return [];
  const sents = clean.match(/[^.!?]+(?:[.!?]+["')\]]*|$)/g) || [clean];
  const out = [];
  for (let s of sents.map(x => x.trim()).filter(Boolean)) {
    while (s.length > 240) {
      const cut = Math.max(s.lastIndexOf(', ', 220), s.lastIndexOf('; ', 220));
      if (cut < 60) break;
      out.push(s.slice(0, cut + 1)); s = s.slice(cut + 2);
    }
    out.push(s);
  }
  return out;
}

function listeningProgram(sess, part, short) {
  const ex = EXAMS[sess.level], P = ex.parts[part.id], B2 = sess.level === 'B2';
  const steps = [];
  const gap = Math.max(150, +VP.gap || 450);
  const speak = (text, who, gender, label, line) => {
    const ss = splitSentences(text);
    ss.forEach((s, i) => { steps.push({ say: s, who, gender, label, line }); steps.push({ gap: i < ss.length - 1 ? gap : Math.round(gap * 1.6) }); });
  };
  const N = (t, label) => t && speak(t, '__narrator', 'f', label || 'Instrucciones');
  const pause = (s, label) => steps.push({ pause: short ? Math.max(3, Math.round(s / 3)) : s, label });
  const lines = (script, label, fallback) => {
    for (const l of scriptLines(script)) speak(l.text, l.speaker || fallback?.name || 'Speaker', l.gender || fallback?.gender, label, l);
  };
  const readTime = { 'l-gap': B2 ? 45 : 20, 'l-speakers': 30, 'l-interview': B2 ? 60 : 45 }[P.kind] || 10;
  N(`${P.label}.`, P.label);
  N(fill(P.ins, P).replace(/(\d+)–(\d+)/g, '$1 to $2').replace(/\(A, B or C\)/g, 'A, B or C').replace(/\(A–H\)/g, 'A to H'));
  if (P.kind === 'l-extracts') {
    for (const q of part.questions) {
      N(`Question ${q.n}. ${q.context || ''} ${q.stem || ''}`, `Pregunta ${q.n}`);
      pause(5, `Pregunta ${q.n}: lee las opciones`);
      lines(q.script, `Pregunta ${q.n} · primera vez`);
      pause(3, 'Pausa');
      N('Now listen again.', `Pregunta ${q.n}`);
      lines(q.script, `Pregunta ${q.n} · segunda vez`);
      pause(5, 'Marca tu respuesta');
    }
  } else if (P.kind === 'l-speakers') {
    N(part.intro);
    pause(readTime, 'Tiempo para leer las opciones');
    for (const pass of [1, 2]) {
      if (pass === 2) N('Now you will hear the five extracts again.');
      for (const q of part.questions) {
        const lab = `${q.speaker} · ${pass === 1 ? 'primera' : 'segunda'} vez`;
        N(q.speaker || `Speaker ${q.n - part.questions[0].n + 1}`, lab);
        lines([{ speaker: q.speaker, gender: q.gender, text: typeof q.script === 'string' ? q.script : scriptLines(q.script).map(l => l.text).join(' ') }], lab);
        pause(2, 'Pausa');
      }
    }
  } else {
    N(part.intro);
    pause(readTime, 'Tiempo para leer las preguntas');
    const fb = part.speaker || null;
    const scr = typeof part.script === 'string' ? [{ speaker: fb?.name || 'Speaker', gender: fb?.gender, text: part.script }] : part.script;
    lines(scr, 'Primera escucha', fb);
    pause(5, 'Pausa');
    N('Now listen again.');
    lines(scr, 'Segunda escucha', fb);
    pause(5, 'Revisa tus respuestas');
  }
  N(`That is the end of ${P.label}.`, 'Fin');
  const speakers = [];
  steps.forEach(s => { if (s.say && s.who !== '__narrator') speakers.push({ name: s.who, gender: s.gender }); });
  return { steps, speakers };
}

/* ---------- live playback ---------- */
const PL = { sessId: null, pid: null, run: 0, i: 0, state: 'idle', label: '', count: 0, short: false, showScript: false, skip: false };

function speakOnce(text, voice) {
  return new Promise(res => {
    const u = new SpeechSynthesisUtterance(text);
    if (voice) { u.voice = voice; u.lang = voice.lang; } else u.lang = 'en-GB';
    u.rate = +VP.rate || 0.92; u.pitch = +VP.pitch || 1;
    u.onend = () => res();
    u.onerror = () => res();
    speechSynthesis.speak(u);
  });
}

async function playPart(sessId, pid) {
  if (!TTS.ok) return;
  const sess = S.sessions[sessId]; const part = sess && (sess.parts || []).find(p => p.id === pid);
  if (!part) return;
  stopAudio();
  const run = ++PL.run;
  const prog = listeningProgram(sess, part, PL.short);
  const cast = TTS.cast(prog.speakers);
  Object.assign(PL, { sessId, pid, i: 0, state: 'playing', steps: prog.steps });
  paintPlayer();
  const wait = async ms => { let w = 0; while (w < ms) { await sleep(50); if (run !== PL.run) return false; if (PL.state !== 'paused') w += 50; } return true; };
  for (let i = 0; i < prog.steps.length; i++) {
    if (run !== PL.run) return;
    PL.i = i; const st = prog.steps[i]; PL.label = st.label || PL.label;
    if (st.gap) { if (!(await wait(st.gap))) return; continue; }
    if (st.pause) {
      PL.skip = false;
      for (let s = st.pause; s > 0; s--) {
        PL.count = s; paintPlayerStatus();
        let waited = 0;
        while (waited < 1000) { await sleep(100); if (run !== PL.run) return; if (PL.state !== 'paused') waited += 100; if (PL.skip) break; }
        if (PL.skip) break;
      }
      PL.count = 0; continue;
    }
    paintPlayerStatus();
    while (PL.state === 'paused') { await sleep(150); if (run !== PL.run) return; }
    await speakOnce(st.say, cast[st.who] || cast.__narrator);
  }
  if (run === PL.run) { PL.state = 'idle'; PL.label = 'Terminado'; paintPlayer(); }
}
function pauseAudio() {
  if (PL.state === 'playing') { PL.state = 'paused'; try { speechSynthesis.pause(); } catch (e) {} }
  else if (PL.state === 'paused') { PL.state = 'playing'; try { speechSynthesis.resume(); } catch (e) {} }
  paintPlayer();
}
function stopAudio() { PL.run++; PL.state = 'idle'; PL.count = 0; try { speechSynthesis.cancel(); } catch (e) {} }
function testVoices() {
  if (!TTS.ok) return;
  stopAudio();
  const c = TTS.cast([{ name: 'A', gender: 'f' }, { name: 'B', gender: 'm' }]);
  const run = ++PL.run;
  (async () => {
    for (const [who, txt] of [['__narrator', 'This is the narrator. You will hear each recording twice.'], ['A', "Hi! I've just got back from the trip. It was amazing, honestly."], ['B', 'Really? I thought you were worried about the weather.']]) {
      if (run !== PL.run) return;
      await speakOnce(txt, c[who]); await sleep(+VP.gap || 450);
    }
  })();
}

/* ---------- MP3 with Kokoro (local edition) ---------- */
const KOKORO_URL = 'https://cdn.jsdelivr.net/npm/kokoro-js@1.2.1/dist/kokoro.web.js';
const KOKORO_MODEL = 'onnx-community/Kokoro-82M-v1.0-ONNX';
const KVOICES = { narrator: 'bf_emma', f: ['af_heart', 'bf_isabella', 'af_bella', 'af_nicole'], m: ['am_michael', 'bm_george', 'am_puck', 'bm_fable'] };
const AU = { busy: false, msg: '', pct: 0, ctl: null, results: {}, err: '' };
let kokoroP = null;

function loadKokoro(onMsg) {
  if (!kokoroP) {
    kokoroP = (async () => {
      onMsg('Cargando el motor de voz…');
      const mod = await import(KOKORO_URL);
      const gpu = !!(window.LOCAL_CFG && window.LOCAL_CFG.gpu && navigator.gpu);
      const files = {};
      return mod.KokoroTTS.from_pretrained(KOKORO_MODEL, {
        dtype: gpu ? 'fp32' : 'q8', device: gpu ? 'webgpu' : 'wasm',
        progress_callback: p => {
          if (p && p.status === 'progress' && p.file) {
            files[p.file] = { loaded: p.loaded || 0, total: p.total || 0 };
            const t = Object.values(files).reduce((a, f) => [a[0] + f.loaded, a[1] + f.total], [0, 0]);
            if (t[1] > 2e6) onMsg(`Descargando las voces (solo la primera vez): ${Math.round(t[0] / 1e6)} de ${Math.round(t[1] / 1e6)} MB`);
          }
        }
      });
    })().catch(e => { kokoroP = null; throw e; });
  }
  return kokoroP;
}

async function renderPartPcm(tts, sess, part, signal, onStep) {
  const prog = listeningProgram(sess, part, PL.short);
  const voiceOf = {}; let fi = 0, mi = 0;
  for (const s of prog.steps) {
    if (!s.say || voiceOf[s.who]) continue;
    if (s.who === '__narrator') voiceOf[s.who] = KVOICES.narrator;
    else if (s.gender === 'm') voiceOf[s.who] = KVOICES.m[mi++ % KVOICES.m.length];
    else voiceOf[s.who] = KVOICES.f[fi++ % KVOICES.f.length];
  }
  const rate = 24000, cache = new Map(), chunks = [];
  const speechSteps = prog.steps.filter(s => s.say);
  const unique = new Set(speechSteps.map(s => s.who + '|' + s.say)).size;
  let done = 0;
  for (const s of prog.steps) {
    if (signal.aborted) throw Object.assign(new Error('cancelled'), { code: 'cancelled' });
    if (s.say) {
      const key = s.who + '|' + s.say;
      if (!cache.has(key)) {
        const a = await tts.generate(s.say, { voice: voiceOf[s.who], speed: Math.min(1.1, Math.max(0.8, +VP.rate || 0.92) + 0.03) });
        cache.set(key, a.audio); done++; onStep(done, unique);
        await sleep(0);
      }
      chunks.push(cache.get(key));
    } else {
      const sec = s.gap ? s.gap / 1000 : s.pause;
      chunks.push(new Float32Array(Math.round(sec * rate)));
    }
  }
  return { chunks, rate };
}

function encodeMp3(chunks, rate) {
  const total = chunks.reduce((t, c) => t + c.length, 0);
  const i16 = new Int16Array(total); let o = 0, peak = 0;
  for (const c of chunks) for (let i = 0; i < c.length; i++) { const v = Math.abs(c[i]); if (v > peak) peak = v; }
  const gain = peak > 0 ? Math.min(3, 0.95 / peak) : 1;
  for (const c of chunks) for (let i = 0; i < c.length; i++) { const v = Math.max(-1, Math.min(1, c[i] * gain)); i16[o++] = v < 0 ? v * 32768 : v * 32767; }
  const secs = total / rate;
  if (window.lamejs && window.lamejs.Mp3Encoder) {
    const enc = new window.lamejs.Mp3Encoder(1, rate, 64), out = [];
    for (let i = 0; i < i16.length; i += 1152) { const b = enc.encodeBuffer(i16.subarray(i, i + 1152)); if (b.length) out.push(b); }
    const f = enc.flush(); if (f.length) out.push(f);
    return { blob: new Blob(out, { type: 'audio/mpeg' }), ext: 'mp3', secs };
  }
  const buf = new ArrayBuffer(44 + i16.length * 2), dv = new DataView(buf);
  const w = (p, s) => { for (let i = 0; i < s.length; i++) dv.setUint8(p + i, s.charCodeAt(i)); };
  w(0, 'RIFF'); dv.setUint32(4, 36 + i16.length * 2, true); w(8, 'WAVE'); w(12, 'fmt '); dv.setUint32(16, 16, true); dv.setUint16(20, 1, true); dv.setUint16(22, 1, true);
  dv.setUint32(24, rate, true); dv.setUint32(28, rate * 2, true); dv.setUint16(32, 2, true); dv.setUint16(34, 16, true); w(36, 'data'); dv.setUint32(40, i16.length * 2, true);
  new Int16Array(buf, 44).set(i16);
  return { blob: new Blob([buf], { type: 'audio/wav' }), ext: 'wav', secs };
}

async function makeListeningAudio(sessId, which) {
  if (AU.busy) return;
  const sess = S.sessions[sessId]; if (!sess) return;
  const parts = (sess.parts || []).filter(p => p.id.startsWith('L') && (which === 'all' || p.id === which));
  if (!parts.length) return;
  const ctl = new AbortController();
  Object.assign(AU, { busy: true, ctl, msg: 'Preparando…', pct: 0, err: '' });
  paintPlayer();
  const say = m => { AU.msg = m; paintAudioStatus(); };
  try {
    const tts = await loadKokoro(say);
    let all = [], rate = 24000;
    for (let k = 0; k < parts.length; k++) {
      const P = EXAMS[sess.level].parts[parts[k].id];
      const r = await renderPartPcm(tts, sess, parts[k], ctl.signal, (d, n) => { AU.pct = Math.round(100 * (k + d / n) / parts.length); say(`Generando ${P.label}: frase ${d} de ${n}`); });
      rate = r.rate; all = all.concat(r.chunks);
      if (k < parts.length - 1) all.push(new Float32Array(rate * 3));
    }
    say('Codificando el MP3…'); await sleep(30);
    const { blob, ext, secs } = encodeMp3(all, rate);
    const st = S.students[sess.studentId] || { name: 'alumno' };
    const label = which === 'all' ? 'Listening' : `Listening_${EXAMS[sess.level].parts[which].label.replace(' ', '')}`;
    const key = sessId + ':' + which;
    if (AU.results[key]) URL.revokeObjectURL(AU.results[key].url);
    AU.results[key] = { url: URL.createObjectURL(blob), blob, name: `${st.name}_${sess.dateKey}_${label}.${ext}`, secs, which };
    toast('Audio listo');
  } catch (e) {
    AU.err = e && e.code === 'cancelled' ? '' : 'No se pudo generar el audio: ' + ((e && e.message) || e) + '. Comprueba la conexión a internet (la primera vez hay que descargar las voces) y vuelve a intentarlo.';
  } finally {
    AU.busy = false; AU.ctl = null; AU.msg = ''; paintPlayer();
  }
}

function paintAudioStatus() { const n = $('#au-msg'); if (n) n.textContent = AU.msg + (AU.pct ? ` · ${AU.pct}%` : ''); }

function audioDownloadHtml(sess) {
  const parts = (sess.parts || []).filter(p => p.id.startsWith('L'));
  if (!window.__LOCAL__) {
    return `<div class="notice small"><b>Audio en MP3 para descargar:</b> esta página no puede grabar las voces. Ve a Ajustes › «Descargar versión local», ábrela en el Mac y entra en esta misma sesión › Audio › MP3. No necesita clave de API ni gasta tu suscripción: las voces se generan en tu ordenador.</div>`;
  }
  const ex = EXAMS[sess.level];
  const res = Object.entries(AU.results).filter(([k]) => k.startsWith(sess.id + ':'));
  return `<div class="part-block"><h4>Audio en MP3 para descargar</h4>
    <p class="small muted">Se genera en este ordenador con voces neuronales (Kokoro), cada grabación dos veces y con las pausas del examen${PL.short ? ' (cortas)' : ''}. La primera vez descarga las voces (unos 90 MB); después tarda unos minutos por parte. No cuesta nada.</p>
    <div class="row">${parts.map(p => btn('MP3 ' + ex.parts[p.id].label, `data-mp3="${p.id}" ${AU.busy ? 'disabled' : ''}`, '', 'play')).join('')}${parts.length > 1 ? btn('Todo en un MP3', `data-mp3="all" ${AU.busy ? 'disabled' : ''}`, 'primary', 'play') : ''}${AU.busy ? btn('Cancelar', 'data-mp3-cancel="1"', 'ghost') : ''}</div>
    ${AU.busy ? `<p class="now" id="au-msg">${esc(AU.msg)}${AU.pct ? ` · ${AU.pct}%` : ''}</p>` : ''}
    ${AU.err ? `<div class="notice err">${esc(AU.err)}</div>` : ''}
    ${res.map(([k, r]) => `<div class="stack" style="gap:6px"><span class="small"><b>${esc(r.name)}</b> · ${Math.floor(r.secs / 60)}:${z2(Math.round(r.secs % 60))} min</span><audio controls preload="metadata" src="${r.url}" style="width:100%"></audio><div class="row">${btn('Descargar', `data-mp3-save="${esc(k)}"`, 'primary', 'pdf')}</div></div>`).join('')}
  </div>`;
}

/* ---------- player UI ---------- */
function voiceSelect(id, role, label) {
  const g = role === 'male' ? 'm' : role === 'female' ? 'f' : '?';
  const list = TTS.ranked('?').sort((a, b) => (TTS.gender(b) === g) - (TTS.gender(a) === g) || TTS.rank(b) - TTS.rank(a));
  return `<label class="field"><span>${label}</span><select id="${id}" data-vp="${role}"><option value="">Automática</option>${list.map(v => `<option value="${esc(v.name)}" ${VP[role] === v.name ? 'selected' : ''}>${esc(v.name)} · ${esc(v.lang)}</option>`).join('')}</select></label>`;
}

function paintPlayer() {
  const box = $('#player'); if (!box) return;
  const sess = S.sessions[S.openId]; if (!sess) return;
  const parts = (sess.parts || []).filter(p => p.id.startsWith('L'));

  if (!PL.pid || !parts.some(p => p.id === PL.pid)) PL.pid = parts[0]?.id;
  const part = parts.find(p => p.id === PL.pid);
  let live = '';
  if (!TTS.ok) live = '<div class="notice warn">Este navegador no puede leer en voz alta. Lee tú la transcripción (está en «Soluciones»).</div>';
  else {
    const noVoices = !TTS.voices.length;
    const playing = PL.sessId === sess.id && PL.state !== 'idle';
    const prog = part ? listeningProgram(sess, part, PL.short) : { steps: [], speakers: [] };
    const scr = prog.steps.filter(s => s.say);
    const curStep = playing ? PL.steps?.[PL.i] : null;
    const cast = TTS.cast(prog.speakers);
    live = `${noVoices ? '<div class="notice warn">No encuentro voces en inglés en este dispositivo. En iPhone/Mac: Ajustes › Accesibilidad › Contenido leído › Voces › Inglés (Reino Unido) y descarga una voz «mejorada» o «premium». Mientras tanto, lee tú la transcripción.</div>' : ''}
    <div class="row">
      ${playing ? btn(PL.state === 'paused' ? 'Continuar' : 'Pausa', 'data-audio="pause"', '', PL.state === 'paused' ? 'play' : 'pause') + btn('Parar', 'data-audio="stop"', '', 'stop') + (PL.count ? btn('Saltar espera', 'data-audio="skip"', 'ghost') : '') : btn('Reproducir como en el examen', 'data-audio="play"', 'primary big', 'play')}
    </div>
    <p class="now" id="pl-now" aria-live="polite">${playing ? esc(PL.label) + (PL.count ? ` · ${PL.count} s` : '') : 'Cada grabación suena dos veces, con pausas para leer y responder.'}</p>
    <details class="more" id="vp-box" ${PL.vpOpen ? 'open' : ''}><summary>Voces y pausas</summary>
      <div class="stack" style="gap:10px;margin-top:10px">
        <p class="small muted">Si una voz suena muy siseante, elige otra (las «mejoradas» o «premium» suenan mejor) o baja un poco el tono.</p>
        <div class="form-grid">${voiceSelect('vp-n', 'narrator', 'Narrador')}${voiceSelect('vp-f', 'female', 'Voz femenina')}${voiceSelect('vp-m', 'male', 'Voz masculina')}</div>
        <div class="form-grid">
          <label class="field"><span>Velocidad</span><select id="vp-rate" data-vp="rate">${[0.8, 0.85, 0.9, 0.92, 0.95, 1, 1.05].map(r => `<option value="${r}" ${+VP.rate === r ? 'selected' : ''}>${r}</option>`).join('')}</select></label>
          <label class="field"><span>Tono</span><select id="vp-pitch" data-vp="pitch">${[0.8, 0.85, 0.9, 0.95, 1, 1.05, 1.1].map(r => `<option value="${r}" ${+VP.pitch === r ? 'selected' : ''}>${r === 1 ? '1 (normal)' : r}</option>`).join('')}</select></label>
          <label class="field"><span>Pausa entre frases</span><select id="vp-gap" data-vp="gap">${[[300, 'Corta (0,3 s)'], [450, 'Normal (0,45 s)'], [700, 'Larga (0,7 s)'], [1000, 'Muy larga (1 s)']].map(([v, l]) => `<option value="${v}" ${+VP.gap === v ? 'selected' : ''}>${l}</option>`).join('')}</select></label>
        </div>
        <div class="row">${btn('Probar las voces', 'data-audio="test"', '', 'play')}</div>
      </div>
    </details>
    ${PL.showScript ? `<div class="transcript" id="pl-tr">${scr.filter((s, i, a) => i === 0 || s.line !== a[i - 1].line || !s.line).map(s => `<p class="${curStep && (curStep === s || (curStep.line && curStep.line === s.line)) ? 'cur' : ''}"><b>${esc(s.who === '__narrator' ? 'Narrator' : s.who)}:</b> ${esc(s.line ? s.line.text : s.say)}</p>`).join('')}</div>` : ''}
    <p class="small muted">Voces en uso: ${esc(Array.from(new Set(Object.values(cast).filter(Boolean).map(v => v.name))).slice(0, 4).join(', ') || '—')}.</p>`;
  }
  box.innerHTML = `<div class="player">
    <div class="chips">${parts.map(p => `<button type="button" class="chip" data-lpart="${p.id}" aria-pressed="${p.id === PL.pid}">${esc(ex.parts[p.id].label)} · ${esc(ex.parts[p.id].title)}</button>`).join('')}</div>
    ${live}
    <div class="row small">
      <label class="row"><input type="checkbox" id="pl-short" ${PL.short ? 'checked' : ''}> Pausas de lectura cortas</label>
      <label class="row"><input type="checkbox" id="pl-script" ${PL.showScript ? 'checked' : ''}> Mostrar transcripción (para ti)</label>
    </div>
    ${audioDownloadHtml(sess)}
  </div>`;
}

function paintPlayerStatus() {
  const n = $('#pl-now'); if (!n) return;
  if (S.view !== 'session' || S.sessTab !== 'audio') return;
  const needsFull = !!$('#player .btn.primary.big') || ($('[data-audio="skip"]') ? 0 : 1) !== (PL.count ? 0 : 1) || PL.showScript;
  if (needsFull) { paintPlayer(); return; }
  n.textContent = PL.label + (PL.count ? ` · ${PL.count} s` : '');
}
</script>
<script>
/* =========================================================
   State
   ========================================================= */
const S = {
  db: null, sample: undefined, dl: null, imagesOk: false, imgMax: 4, dbState: 'loading',
  students: {}, sessions: {}, notebooks: {},
  cur: null, view: 'today', openId: null, sessTab: 'preview', listFilter: 'all',
  gen: {}, pick: {}, drafts: {}, busy: {}, errors: {}, confirmDel: null, filled: {}
};

/* =========================================================
   Persistence
   ========================================================= */
function handleWriteErr(e) {
  console.warn('db write', e);
  if (e && e.code === 'quota_exceeded') toast('El almacenamiento está lleno: borra sesiones antiguas en «Sesiones».');
  else if (e && e.code === 'invalid_argument') toast('No tienes permiso para guardar cambios en esta app.');
  else toast('No se pudo guardar. Revisa la conexión.');
}
async function writeDoc(path, body) { if (!S.db) return; try { await S.db.doc(path).set(clone(body)); } catch (e) { handleWriteErr(e); } }
async function saveSession(id, data) { const b = stripId(data); S.sessions[id] = Object.assign({ id }, b); await writeDoc('sessions/' + id, b); }
async function saveNotebook(stId, nb) { S.notebooks[stId] = nb; await writeDoc('notebooks/' + stId, nb); }
async function saveStudent(id, data) { const b = stripId(data); S.students[id] = Object.assign({ id }, b); await writeDoc('students/' + id, b); }
async function deleteSession(id) {
  delete S.sessions[id];
  if (S.db) { try { await S.db.doc('sessions/' + id).delete(); } catch (e) { handleWriteErr(e); } }
}
function saveDraftLocal(id, val) { try { if (val) localStorage.setItem('cec-draft-' + id, JSON.stringify(val)); else localStorage.removeItem('cec-draft-' + id); } catch (e) {} }
function loadDraftLocal(id) { try { const v = localStorage.getItem('cec-draft-' + id); return v ? JSON.parse(v) : null; } catch (e) { return null; } }
function draftOf(id) { if (!S.drafts[id]) S.drafts[id] = loadDraftLocal(id) || Object.assign({}, S.sessions[id]?.answers || {}); return S.drafts[id]; }
let draftTimer = null;
function touchDraft(id) { clearTimeout(draftTimer); draftTimer = setTimeout(() => saveDraftLocal(id, S.drafts[id]), 400); }

/* =========================================================
   Small UI helpers
   ========================================================= */
let toastTimer = null;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, 3200); }
const ICON = {

};
function btn(label, attrs = '', cls = '', icon = '') { return `<button type="button" class="btn ${cls}" ${attrs}>${icon ? ICON[icon] : ''}${esc(label)}</button>`; }
function partShort(id, P) { return `${P.paper === 'Listening' ? 'Listening' : id.startsWith('U') ? 'UoE' : 'Reading'} ${P.label.replace('Part ', 'P')}`; }
function exportDocs() {
  const docs = {};
  for (const [id, v] of Object.entries(S.students)) docs['students/' + id] = stripId(v);
  for (const [id, v] of Object.entries(S.sessions)) docs['sessions/' + id] = stripId(v);
  for (const [id, v] of Object.entries(S.notebooks)) docs['notebooks/' + id] = v;
  return docs;
}
function studentList() { return Object.values(S.students).sort((a, b) => (a.order || 99) - (b.order || 99) || String(a.name).localeCompare(b.name)); }
function curStudent() { return S.students[S.cur] || null; }
function todayKey() { return dateKey(); }
function todaySkill(st) { return planOf(st)[new Date().getDay()]; }
function statusPill(sess) {
  if (sess.status === 'corrected') return `<span class="pill done">${ICON.check.replace('<svg', '<svg width="12" height="12"')} ${sess.results?.pct ?? 0}%</span>`;
  return `<span class="pill todo">Por corregir</span>`;
}
function sessTitle(sess) {
  const ex = EXAMS[sess.level];
  if (sess.skill === 'writing') return `Writing · Part ${sess.writing?.part || ''} ${sess.writing?.type === 'choice' ? '(a elegir)' : sess.writing?.type ? '· ' + sess.writing.type : ''}`;
  if (sess.skill === 'speaking') return 'Speaking · 4 partes';
  return (sess.parts || []).map(p => `${ex.parts[p.id].paper === 'Listening' ? 'L' : 'P'}${ex.parts[p.id].label.replace('Part ', '')}`).join(' · ');
}
function sessTopics(sess) {
  return [...(sess.parts || []).map(p => p.topic || p.title), sess.writing?.topic, sess.speaking?.topic].filter(Boolean).join(' · ');
}
function pendingFor(stId) { return studentSessions(stId).filter(s => s.status !== 'corrected' && s.dateKey < todayKey()); }
function todaysFor(stId) { return studentSessions(stId).filter(s => s.dateKey === todayKey()); }

/* =========================================================
   Render: students + nav
   ========================================================= */
function renderStudents() {
  const box = $('#students'); const list = studentList();
  if (!list.length) { box.innerHTML = ''; return; }
  box.innerHTML = list.map(st => {
    const ex = EXAMS[st.level] || EXAMS.B2;
    const pend = pendingFor(st.id).length, today = todaysFor(st.id);
    const g = S.gen[st.id];
    let state = '';
    if (g && g.running) state = '<span class="pill info">Generando…</span>';
    else if (pend) state = `<span class="pill todo">${pend} por corregir</span>`;
    else if (today.length) state = today.some(s => s.status === 'corrected') ? '<span class="pill done">Hoy: hecha</span>' : '<span class="pill plain">Hoy: lista</span>';
    return `<button type="button" class="cand" data-student="${esc(st.id)}" aria-pressed="${st.id === S.cur}">
      <span class="av" aria-hidden="true">${esc((st.name || '?').charAt(0).toUpperCase())}</span>
      <span class="who"><b>${esc(st.name)}</b><span>${esc(ex.name)} · ${esc(SKILLS[todaySkill(st)]?.es || '')} hoy</span></span>
      <span class="state">${state}</span>
    </button>`;
  }).join('');
}
function renderNav() {
  $$('#nav button').forEach(b => b.setAttribute('aria-current', (b.dataset.view === S.view || (S.view === 'session' && b.dataset.view === 'sessions')) ? 'page' : 'false'));
  const t = new Date();
  $('#today-label').textContent = `${DOW_ES[t.getDay()].replace(/^./, c => c.toUpperCase())} ${t.getDate()} de ${MONTHS_ES[t.getMonth()]} · entrenamiento diario B1 · B2`;
}
function renderBanner() {
  const b = $('#banner'); const msgs = [];
  if (S.dbState === 'none' && !window.__LOCAL__) msgs.push('<div class="notice warn">No hay almacenamiento en esta vista: lo que hagas no se guardará. Abre la app desde claude.ai para conservar sesiones y progreso.</div>');
  if (window.__LOCAL__ && !window.LOCAL_CFG.key) msgs.push('<div class="notice">Versión local sin clave de API: puedes abrir e imprimir las sesiones y crear los <b>MP3 del listening</b> (pestaña Audio de cada sesión). Para generar o corregir sesiones usa la versión web con tu suscripción, o pon una clave de API en Ajustes (se paga aparte).</div>');
  if (S.dbState === 'revoked') msgs.push('<div class="notice err">Se ha perdido el acceso a los datos. Recarga la página.</div>');
  b.innerHTML = msgs.join('');
  b.hidden = !msgs.length;
  if (msgs.length) b.style.marginBottom = '14px';
}
function renderAll() { renderNav(); renderBanner(); renderStudents(); renderMain(); renderSide(); }

/* =========================================================
   Render: main
   ========================================================= */
function renderMain(force) {
  const m = $('#main');
  const sess = S.openId && S.sessions[S.openId];
  const ae = document.activeElement;
  const typing = S.view === 'settings' || (S.view === 'session' && sess && S.sessTab === 'correct' && sess.status !== 'corrected' && !S.busy[S.openId]) || (S.view === 'today' && ae && (ae.id === 'g-custom' || ae.id === 's-note'));
  if (!force && typing && m.dataset.sig === `${S.view}|${S.openId}|${S.sessTab}`) return;
  m.dataset.sig = `${S.view}|${S.openId}|${S.sessTab}`;
  if (S.dbState === 'loading') { m.innerHTML = '<div class="card empty">Cargando…</div>'; return; }
  if (!studentList().length && S.view !== 'settings') { m.innerHTML = setupHtml(); return; }
  if (S.view === 'today') m.innerHTML = todayHtml();
  else if (S.view === 'sessions') m.innerHTML = sessionsHtml();
  else if (S.view === 'session') m.innerHTML = sess ? sessionHtml(sess) : '<div class="card empty">Esta sesión ya no existe.</div>';
  else if (S.view === 'progress') m.innerHTML = progressHtml();
  else if (S.view === 'settings') m.innerHTML = settingsHtml();
  if (S.view === 'session' && S.sessTab === 'audio') paintPlayer();
}

function setupHtml() {
  return `<section class="card stack">
    <div><p class="eyebrow">Primer paso</p><h2 class="h2">Añade a tus alumnos</h2></div>
    <p class="muted">Cada alumno tiene su nivel (B1 Preliminary o B2 First for Schools), su plan semanal y su cuaderno de errores.</p>
    <form id="add-student" class="form-grid">
      <label class="field"><span>Nombre</span><input id="new-name" required placeholder="Nombre"></label>
      <label class="field"><span>Nivel</span><select id="new-level"><option value="B2">B2 First for Schools</option><option value="B1">B1 Preliminary for Schools</option></select></label>
      <div class="field"><span>&nbsp;</span><button class="btn primary" type="submit">Añadir alumno</button></div>
    </form>
  </section>`;
}

function chosenTopic(st, pick) {
  if (!pick || !pick.grammar) return null;
  if (pick.grammar === 'custom') {
    const t = String(pick.grammarText || '').trim();
    return t ? { id: 'custom-' + tagKey(t).slice(0, 40), en: t, es: t, tag: 'accuracy', custom: true } : null;
  }
  return allGrammar().find(t => t.id === pick.grammar) || null;
}

function grammarPickerHtml(st, pick, autoTopic) {
  const done = new Set(st.grammarDone || []);
  const order = st.level === 'B2' ? ['B2', 'C1', 'B1'] : ['B1', 'B2', 'C1'];
  const groups = order.map(lv => `<optgroup label="${lv}">${GRAMMAR[lv].map(t => `<option value="${t.id}" ${pick.grammar === t.id ? 'selected' : ''}>${done.has(t.id) ? '✓ ' : ''}${esc(t.es)}</option>`).join('')}</optgroup>`).join('');
  return `<div class="form-grid">
      <label class="field"><span>Gramática de hoy</span><select id="g-topic" data-gpick="1">
        <option value="" ${!pick.grammar ? 'selected' : ''}>Automática · toca: ${esc(autoTopic.es)}</option>
        <option value="custom" ${pick.grammar === 'custom' ? 'selected' : ''}>Otro tema (lo escribo yo)…</option>
        ${groups}
      </select></label>
      ${pick.grammar === 'custom' ? `<label class="field"><span>Tema de gramática</span><input id="g-custom" data-gtext="1" value="${esc(pick.grammarText || '')}" placeholder="p. ej. past perfect y narrative tenses" autocomplete="off"></label>` : ''}
    </div>
    <label class="field"><span>Indicaciones para esta sesión (opcional)</span><input id="s-note" data-snote="1" value="${esc(pick.note || '')}" placeholder="p. ej. examen del colegio el viernes: unidad 3, viajes y transporte" autocomplete="off"></label>
    <p class="small muted" style="margin-top:-6px">Los temas con ✓ ya los ha trabajado. Elegir uno a mano no rompe la secuencia: al día siguiente sigue con el siguiente pendiente.</p>`;
}

function genPick(st) {
  const k = st.id;
  if (!S.pick[k] || S.pick[k].day !== todayKey() || !Array.isArray(S.pick[k].skills)) {
    let skill = todaySkill(st); if (skill === 'rest') skill = 'use';
    S.pick[k] = { day: todayKey(), skills: [skill], parts: autoPartsFor(st, [skill]), grammar: '', grammarText: '', note: '' };
  }
  return S.pick[k];
}

function todayHtml() {
  const st = curStudent(); if (!st) return '';
  const ex = EXAMS[st.level] || EXAMS.B2;
  const now = new Date(), planned = todaySkill(st), rest = planned === 'rest';
  const pick = genPick(st), g = S.gen[st.id];
  const pend = pendingFor(st.id), today = todaysFor(st.id);
  const plan = planFromPick(st, pick);
  const examMin = sessionMinutes(st.level, plan.parts) + (plan.writing ? 15 : 0) + (plan.speaking ? speakMin(st) : 0);
  const mins = GRAMMAR_MIN + examMin, maxMin = +st.minutes || 20;
  const autoTopic = pickGrammarTopic(st), manual = chosenTopic(st, pick);
  const topic = manual || autoTopic;
  const pools = POOLS[st.level];
  const objSel = pick.skills.filter(k => OBJ_SKILLS.includes(k));
  const candidates = examOrder(st.level, Array.from(new Set(objSel.flatMap(k => (k === 'mock' ? [...pools.use, ...pools.reading, ...pools.listening] : pools[k])))));
  const kinds = [plan.parts.length ? 'una sesión con las partes de examen' : '', plan.writing ? 'una de Writing' : '', plan.speaking ? 'una de Speaking' : ''].filter(Boolean);
  const others = studentList().filter(s => s.id !== st.id);

  let html = `<section class="card stack">
    <div class="today-head">
      <div class="stack" style="gap:6px">
        <p class="eyebrow">Hoy · ${esc(niceDate(todayKey()))} · ${esc(st.name)}</p>
        <h2 class="today-skill">${rest ? 'Día de descanso' : esc(SKILLS[planned].es)}</h2>
        <p class="muted">${rest ? 'Toca inglés suave: una serie, un vídeo o una lectura. Si aun así quieres una sesión, elige la destreza abajo.' : esc(SKILLS[planned].desc) + ' · ' + esc(ex.name)}</p>
      </div>
    </div>
    <div class="routine">
      <div><b>Corrige la de ayer</b>Foto de la hoja de respuestas o márcalas tú. La app corrige y explica.</div>
      <div><b>Imprime la corrección</b>Original corregido, por qué falló y ejercicios de refuerzo.</div>
      <div><b>Genera la de hoy</b>5 min de gramática + práctica de examen (máx. ${maxMin} min). Imprime ejercicios + hoja.</div>
    </div>`;
  if (pend.length) {
    html += `<div class="notice warn stack" style="gap:8px"><b>Pendiente de corregir</b>${pend.slice(0, 3).map(s => `<div class="spread"><span>${esc(SKILLS[s.skill]?.es)} · ${esc(niceDate(s.dateKey))}</span>${btn('Corregir', `data-open="${s.id}" data-tab="correct"`, '', 'check')}</div>`).join('')}</div>`;
  }
  html += `</section>`;

  if (today.length) {
    html += `<section class="card stack"><div class="spread"><h3 class="h3">Sesión de hoy</h3></div>`;
    for (const s of today) html += sessionQuick(s);
    html += `</section>`;
  }

  html += `<section class="card stack" id="gen-box">
    <div class="spread"><h3 class="h3">${today.length ? 'Generar otra sesión' : 'Generar la sesión de hoy'}</h3><span class="pill ${mins > maxMin ? 'todo' : 'plain'}">≈ ${mins} min · ${GRAMMAR_MIN} de gramática + ${examMin}${mins > maxMin ? ` · pasa de ${maxMin}` : ''}</span></div>
    <div class="stack" style="gap:8px">
      <span class="small muted">Destrezas (puedes marcar varias el mismo día)</span>
      <div class="chips" role="group" aria-label="Destrezas">${SKILL_KEYS.map(k => `<button type="button" class="chip" data-skill="${k}" aria-pressed="${pick.skills.includes(k)}">${esc(SKILLS[k].es)}${k === planned ? ' <small>plan</small>' : ''}</button>`).join('')}</div>
      ${kinds.length > 1 ? `<p class="small muted">Se crearán ${kinds.join(', ').replace(/, ([^,]*)$/, ' y $1')}, cada una con su PDF. La gramática va en la primera.</p>` : ''}
    </div>`;
  if (candidates.length) {
    const last = lastDoneMap(st.id);
    html += `<div class="stack" style="gap:8px">
      <span class="small muted">Partes del examen (elegidas automáticamente entre las menos practicadas para no pasar de ${maxMin} min; puedes cambiarlas)</span>
      <div class="chips" role="group" aria-label="Partes">${candidates.map(id => { const P = ex.parts[id]; return `<button type="button" class="chip" data-part="${id}" aria-pressed="${pick.parts.includes(id)}" title="${esc(P.es)}${last[id] ? ' · última vez ' + esc(shortDate(dateKey(new Date(last[id])))) : ' · nunca'}">${partShort(id, P)} · ${esc(P.title)}<small>${P.minutes}′</small></button>`; }).join('')}</div>
    </div>`;
  }
  html += grammarPickerHtml(st, pick, autoTopic);
  const dlist = [...plan.parts, ...(plan.writing ? [`W${nextWritingPart(st)}`] : [])];
  const dtxt = dlist.length ? Array.from(new Set(dlist.map(id => DIFF_ES[diffOf(st, id)]))).join(' / ') : DIFF_ES[2];
  html += `<div class="meta-line"><span>Dificultad: <b>${esc(dtxt)}</b></span><span>Gramática de hoy: <b>${esc(topic.es)}</b>${manual ? ' (elegida a mano)' : ''}</span>${plan.writing ? `<span>Writing: <b>Part ${nextWritingPart(st)}</b></span>` : ''}</div>`;
  if (g && (g.running || g.error)) {
    html += `<div class="stack" style="gap:8px"><div class="steps">${g.steps.map(s => `<div class="step ${s.state}"><span class="dot" aria-hidden="true"></span><span>${esc(s.label)}${s.state === 'error' ? ` — <span class="muted">${esc(s.msg || '')}</span>` : ''}</span></div>`).join('')}</div>
      ${g.running ? `<p class="small muted">Claude está escribiendo textos originales y comprobando cada respuesta. Suele tardar 1–3 minutos; puedes seguir usando la app.</p>` : ''}
      ${g.error ? `<div class="notice err">${esc(g.error)}</div>` : ''}</div>`;
  }
  const canGen = !(g && g.running) && (plan.writing || plan.speaking || plan.parts.length > 0);
  html += `<div class="row">
      ${g && g.running ? btn('Cancelar', `data-cancel-gen="${st.id}"`, '') : btn(`Generar sesión de ${st.name}`, `data-generate="${st.id}" ${canGen ? '' : 'disabled'}`, 'primary big', 'spark')}
      ${others.length && !(g && g.running) ? btn(`Generar la de hoy para ${[st, ...others].map(s => s.name).join(' y ')}`, 'data-generate-all="1"', '') : ''}
    </div>
    ${S.sample === null ? '<p class="small muted">Para generar y corregir, abre la app dentro de claude.ai (la primera vez te pedirá permiso para usar Claude).</p>' : ''}
  </section>`;
  return html;
}

function sessionQuick(s) {
  const pdfs = s.skill === 'speaking'
    ? btn('Guion examinador', `data-pdf="examiner" data-id="${s.id}"`, '', 'pdf') + btn('Hoja del alumno', `data-pdf="exam" data-id="${s.id}"`, '', 'pdf')
    : btn(s.skill === 'writing' ? 'Imprimir tarea + hojas' : 'Imprimir ejercicios + hoja', `data-pdf="pack" data-id="${s.id}"`, 'primary', 'pdf') + btn('Soluciones (para ti)', `data-pdf="solutions" data-id="${s.id}"`, '', 'key');
  return `<div class="stack" style="gap:10px;border-top:1px dashed var(--line);padding-top:12px">
    <div class="spread"><div><b>${esc(SKILLS[s.skill]?.es)}</b> · <span class="muted">${esc(sessTitle(s))}</span><div class="small muted">${esc(sessTopics(s))}</div></div>${statusPill(s)}</div>

  </div>`;
}

  if (S.listFilter === 'done') list = list.filter(s => s.status === 'corrected');
