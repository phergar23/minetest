<title>Cambridge en Casa</title>

<style>
:root {
  --bg: #F3F4F7;
  --surface: #FFFFFF;
  --surface-2: #F8F9FB;
  --ink: #1A1F2B;
  --muted: #5E6472;

  --f-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {

    color-scheme: dark;
    --bg: #111319;
    --surface: #1A1D25;
    --surface-2: #20242E;
    --ink: #E8EAF0;
    --muted: #A1A7B4;
    --faint: #7B8190;
    --line: #2C303B;
    --omr: #EE6D9E;
    --omr-ink: #F58DB4;
    --omr-soft: #3A1F2B;
    --pencil: #D2D6E0;
    --ok: #52C48E;
    --ok-soft: #16302A;
    --bad: #F2806A;
    --bad-soft: #3B211C;
    --warn: #E2B55C;
    --warn-soft: #33291A;
    --focus: #7EA6F5;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 6px 20px rgba(0, 0, 0, .25);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #111319;
  --surface: #1A1D25;
  --surface-2: #20242E;
  --ink: #E8EAF0;
  --muted: #A1A7B4;
  --faint: #7B8190;
  --line: #2C303B;
  --omr: #EE6D9E;
  --omr-ink: #F58DB4;
  --omr-soft: #3A1F2B;
  --pencil: #D2D6E0;
  --ok: #52C48E;
  --ok-soft: #16302A;
  --bad: #F2806A;
  --bad-soft: #3B211C;
  --warn: #E2B55C;
  --warn-soft: #33291A;
  --focus: #7EA6F5;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 6px 20px rgba(0, 0, 0, .25);
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--f-body);
  font-size: 15px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3 { font-family: var(--f-display); line-height: 1.15; margin: 0; text-wrap: balance; }
p { margin: 0; }
a { color: var(--omr-ink); }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

.app { max-width: 1180px; margin: 0 auto; padding-inline: 20px; padding-block: 18px 64px; }
@media (max-width: 520px) { .app { padding-inline: 16px; } }

/* Header */
.top { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; padding-block: 4px 18px; }
.brand { display: flex; align-items: center; gap: 12px; }
.brand-mark { display: grid; grid-template-columns: repeat(2, 14px); gap: 4px; }
.brand-mark i { width: 14px; height: 8px; border: 1.5px solid var(--omr); border-radius: 5px; display: block; }
.brand-mark i.on { background: var(--pencil); border-color: var(--pencil); }
.brand h1 { font-size: 22px; font-weight: 800; letter-spacing: -.01em; }
.brand p { color: var(--muted); font-size: 13px; }
.nav { display: flex; gap: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 4px; flex-wrap: wrap; }
.nav button { border: 0; background: transparent; padding: 7px 12px; border-radius: 8px; cursor: pointer; color: var(--muted); font-weight: 700; font-size: 14px; }
.nav button[aria-current="page"] { background: var(--omr-soft); color: var(--omr-ink); }

/* Students */
.students { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; margin-bottom: 18px; }
.cand { display: flex; align-items: center; gap: 14px; text-align: left; background: var(--surface); border: 1.5px solid var(--line); border-radius: 14px; padding: 12px 14px; cursor: pointer; box-shadow: var(--shadow); }
.cand[aria-pressed="true"] { border-color: var(--omr); box-shadow: 0 0 0 3px var(--omr-soft); }
.cand .av { width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; font-family: var(--f-display); font-weight: 800; font-size: 18px; background: var(--omr-soft); color: var(--omr-ink); flex: none; }
.cand .who { display: grid; gap: 2px; min-width: 0; }
.cand .who b { font-family: var(--f-display); font-size: 18px; }
.cand .who span { color: var(--muted); font-size: 13px; }
.cand .state { margin-left: auto; text-align: right; font-size: 12px; color: var(--muted); display: grid; gap: 4px; justify-items: end; }

/* Layout */
.grid { display: grid; grid-template-columns: minmax(0, 1fr) 330px; gap: 18px; align-items: start; }
@media (max-width: 980px) { .grid { grid-template-columns: minmax(0, 1fr); } }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 18px; box-shadow: var(--shadow); }
.stack { display: grid; gap: 16px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.spread { display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.eyebrow { font-family: var(--f-mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--omr-ink); font-weight: 600; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.h2 { font-size: 24px; font-weight: 800; letter-spacing: -.01em; }
.h3 { font-size: 17px; font-weight: 700; }
hr.sep { border: 0; border-top: 1px dashed var(--line); margin: 4px 0; }

/* Buttons */
.btn { display: inline-flex; align-items: center; gap: 8px; border: 1.5px solid var(--line); background: var(--surface); padding: 9px 14px; border-radius: 10px; cursor: pointer; font-weight: 700; font-size: 14px; line-height: 1.2; }
.btn:hover { border-color: var(--faint); }
.btn.primary { background: var(--omr); border-color: var(--omr); color: #fff; }
.btn.primary:hover { filter: brightness(1.06); }
.btn.ghost { border-color: transparent; background: transparent; color: var(--muted); }
.btn.danger { color: var(--bad); }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.btn svg { width: 16px; height: 16px; flex: none; }
.btn.big { padding: 12px 18px; font-size: 15px; }

/* Chips */
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1.5px solid var(--line); background: var(--surface-2); padding: 6px 10px; border-radius: 999px; font-size: 13px; font-weight: 700; cursor: pointer; color: var(--muted); }
.chip[aria-pressed="true"] { border-color: var(--omr); background: var(--omr-soft); color: var(--omr-ink); }
.chip small { font-family: var(--f-mono); font-weight: 500; opacity: .8; margin-left: 4px; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px; border-radius: 999px; font-size: 12px; font-weight: 700; white-space: nowrap; }
.pill.todo { background: var(--warn-soft); color: var(--warn); }
.pill.done { background: var(--ok-soft); color: var(--ok); }
.pill.err { background: var(--bad-soft); color: var(--bad); }
.pill.info { background: var(--omr-soft); color: var(--omr-ink); }
.pill.plain { background: var(--surface-2); color: var(--muted); border: 1px solid var(--line); }

/* Today hero */
.today-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.today-skill { font-family: var(--f-display); font-size: 34px; font-weight: 800; letter-spacing: -.02em; line-height: 1.05; }
.meta-line { display: flex; gap: 14px; flex-wrap: wrap; color: var(--muted); font-size: 13px; }
.meta-line b { color: var(--ink); font-family: var(--f-mono); font-weight: 600; }
.routine { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; counter-reset: step; }
@media (max-width: 640px) { .routine { grid-template-columns: minmax(0, 1fr); } }
.routine div { border: 1px dashed var(--line); border-radius: 12px; padding: 10px 12px; font-size: 13px; color: var(--muted); }
.routine div b { display: block; color: var(--ink); font-size: 14px; margin-bottom: 2px; }
.routine div::before { counter-increment: step; content: counter(step); font-family: var(--f-mono); font-weight: 600; color: var(--omr-ink); font-size: 12px; display: block; }

/* Progress list during generation */
.steps { display: grid; gap: 6px; }
.step { display: flex; align-items: center; gap: 10px; font-size: 14px; }
.step .dot { width: 18px; height: 11px; border-radius: 6px; border: 1.5px solid var(--omr); flex: none; }
.step.running .dot { background: linear-gradient(90deg, var(--omr) 0 50%, transparent 50%); background-size: 200% 100%; animation: fill 1.2s linear infinite; }
.step.done .dot { background: var(--pencil); border-color: var(--pencil); }
.step.error .dot { border-color: var(--bad); background: var(--bad-soft); }
@keyframes fill { from { background-position: 100% 0; } to { background-position: 0 0; } }
@media (prefers-reduced-motion: reduce) { .step.running .dot { animation: none; background: var(--omr-soft); } }

/* Session list */
.slist { display: grid; gap: 8px; }
.sitem { display: grid; grid-template-columns: 64px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 10px 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); cursor: pointer; text-align: left; width: 100%; }
.sitem:hover { border-color: var(--faint); }
.sitem .date { font-family: var(--f-mono); font-size: 12px; color: var(--muted); line-height: 1.3; }
.sitem .date b { display: block; font-size: 18px; color: var(--ink); font-family: var(--f-display); }
.sitem .t { font-weight: 700; }
.sitem .d { color: var(--muted); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.score { font-family: var(--f-mono); font-weight: 600; font-variant-numeric: tabular-nums; }

/* Lozenges (answer-sheet marks) */
.loz { display: inline-grid; place-items: center; min-width: 34px; height: 22px; padding: 0 6px; border: 1.5px solid var(--omr); border-radius: 11px; font-family: var(--f-mono); font-size: 12px; font-weight: 600; color: var(--omr-ink); background: transparent; cursor: pointer; }
.loz[aria-pressed="true"] { background: var(--pencil); border-color: var(--pencil); color: var(--surface); }
.loz.key { box-shadow: 0 0 0 2px var(--ok); }
.ans-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 8px 18px; }
.ans-row { display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 8px; align-items: center; padding: 4px 0; }
.ans-row .n { font-family: var(--f-mono); font-weight: 600; font-size: 13px; color: var(--muted); text-align: right; }
.ans-row .opts { display: flex; gap: 5px; flex-wrap: wrap; }
.ans-row input { width: 100%; border: 1.5px solid var(--line); border-radius: 8px; padding: 6px 9px; background: var(--surface-2); font-family: var(--f-mono); font-size: 14px; text-transform: uppercase; letter-spacing: .04em; }
.ans-row input:focus { border-color: var(--omr); outline: none; }
.ans-row.wide { grid-column: 1 / -1; }
.ans-row.filled input, .ans-row.filled .opts { animation: flash 1.2s ease-out 1; }
@keyframes flash { from { box-shadow: 0 0 0 3px var(--omr-soft); } to { box-shadow: none; } }
.part-block { border-top: 1px solid var(--line); padding-top: 12px; display: grid; gap: 8px; }
.part-block h4 { margin: 0; font-family: var(--f-display); font-size: 15px; }
.res { display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 8px; padding: 8px 0; border-bottom: 1px dashed var(--line); font-size: 14px; }
.res .n { font-family: var(--f-mono); font-weight: 600; text-align: right; }
.res.ok .n { color: var(--ok); }
.res.ko .n { color: var(--bad); }
.res .given { font-family: var(--f-mono); }
.res .given s { color: var(--bad); }
.res .key { font-family: var(--f-mono); color: var(--ok); font-weight: 600; }

/* Preview of exercise */
.paper { background: var(--surface-2); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; font-size: 14.5px; line-height: 1.6; max-height: 520px; overflow: auto; }
.paper h5 { font-family: var(--f-display); font-size: 15px; margin: 0 0 6px; }
.paper .ins { color: var(--muted); font-size: 13px; margin-bottom: 8px; }
.paper .gap { font-family: var(--f-mono); font-weight: 600; color: var(--omr-ink); white-space: nowrap; }
.paper p + p { margin-top: 8px; }
.paper ol { padding-left: 22px; margin: 8px 0; }
.paper .opt { color: var(--muted); }

/* Side */
.week { display: grid; grid-template-columns: 76px repeat(7, minmax(0, 1fr)); gap: 6px 4px; align-items: center; font-size: 12px; }
.week .dh { text-align: center; font-family: var(--f-mono); color: var(--muted); font-size: 11px; }
.week .dh.today { color: var(--omr-ink); font-weight: 600; }
.week .nm { font-weight: 700; font-size: 13px; overflow: hidden; text-overflow: ellipsis; }
.week .cell { display: grid; place-items: center; }
.week .cell i { width: 22px; height: 13px; border-radius: 7px; border: 1.5px solid var(--omr); display: block; }
.week .cell i.gen { background: linear-gradient(90deg, var(--pencil) 0 50%, transparent 50%); }
.week .cell i.done { background: var(--pencil); border-color: var(--pencil); }
.week .cell i.rest { border-style: dashed; border-color: var(--line); }
.week .sk { text-align: center; color: var(--faint); font-size: 10px; font-family: var(--f-mono); }
.weak { display: grid; gap: 8px; }
.weak-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 10px; font-size: 13px; }
.weak-row .bar { grid-column: 1 / -1; height: 6px; background: var(--surface-2); border-radius: 3px; overflow: hidden; }
.weak-row .bar span { display: block; height: 100%; background: var(--omr); border-radius: 3px; }
.legend-cat { font-size: 11px; color: var(--muted); font-family: var(--f-mono); }

/* Forms */
.field { display: grid; gap: 4px; font-size: 13px; }
.field > span { color: var(--muted); font-weight: 700; }
.field input, .field select, .field textarea { border: 1.5px solid var(--line); border-radius: 9px; padding: 8px 10px; background: var(--surface-2); width: 100%; }
.field textarea { min-height: 160px; resize: vertical; line-height: 1.5; }
.form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
.plan-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; }
.range { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 10px; align-items: center; font-size: 14px; }
.range input { grid-column: 1 / -1; width: 100%; accent-color: var(--omr); }

/* Notices */
.notice { border-radius: 12px; padding: 12px 14px; font-size: 14px; border: 1px solid var(--line); background: var(--surface-2); }
.notice.warn { background: var(--warn-soft); border-color: transparent; color: var(--warn); }
.notice.err { background: var(--bad-soft); border-color: transparent; color: var(--bad); }
.notice.ok { background: var(--ok-soft); border-color: transparent; color: var(--ok); }
.confirm { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; background: var(--bad-soft); color: var(--bad); padding: 8px 10px; border-radius: 10px; font-size: 13px; font-weight: 700; }

/* Tiles & chart */
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
.tile { border: 1px solid var(--line); border-radius: 12px; padding: 12px; background: var(--surface-2); }
.tile b { display: block; font-family: var(--f-display); font-size: 26px; font-variant-numeric: tabular-nums; }
.tile span { color: var(--muted); font-size: 12px; }
.chart-wrap { overflow-x: auto; }
.chart-wrap svg { display: block; }
.chart-wrap .grid-l { stroke: var(--line); stroke-width: 1; }
.chart-wrap .ax { fill: var(--muted); font-size: 11px; font-family: var(--f-mono); }
.chart-wrap .bar { fill: var(--omr); }
.chart-wrap .bar:hover { fill: var(--omr-ink); }
.skill-bars { display: grid; gap: 8px; }
.skill-bars .sb { display: grid; grid-template-columns: 110px minmax(0, 1fr) 48px; gap: 10px; align-items: center; font-size: 13px; }
.skill-bars .track { height: 10px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.skill-bars .track span { display: block; height: 100%; background: var(--omr); border-radius: 0 4px 4px 0; }

/* Listening player */
.player { display: grid; gap: 10px; border: 1px solid var(--line); background: var(--surface-2); border-radius: 12px; padding: 14px; }
.player .now { font-family: var(--f-mono); font-size: 13px; color: var(--omr-ink); min-height: 1.4em; }
.transcript { font-size: 13.5px; color: var(--muted); max-height: 260px; overflow: auto; border-top: 1px dashed var(--line); padding-top: 8px; }
.transcript p { margin: 4px 0; }
.transcript p.cur { color: var(--ink); background: var(--omr-soft); border-radius: 6px; padding: 2px 6px; }

.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: 14px; font-weight: 700; box-shadow: var(--shadow); z-index: 20; max-width: calc(100% - 32px); }
.empty { text-align: center; padding: 26px 12px; color: var(--muted); }
details.more summary { cursor: pointer; font-weight: 700; color: var(--muted); font-size: 14px; }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.tabs button { border: 0; background: none; padding: 8px 12px; font-weight: 700; color: var(--muted); cursor: pointer; border-bottom: 2.5px solid transparent; margin-bottom: -1px; }
.tabs button[aria-current="true"] { color: var(--omr-ink); border-bottom-color: var(--omr); }
.file-drop { border: 1.5px dashed var(--omr); border-radius: 12px; padding: 12px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; background: var(--omr-soft); color: var(--omr-ink); font-size: 14px; }
.file-drop input { font-size: 13px; max-width: 100%; }
.wr-crit { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
</style>
